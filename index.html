<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Jump: Авторизация</title>
    <!-- Официальная библиотека Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010105;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Интерактивный Canvas: глубокий космос, планета, орбитальная станция и звезды */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
            pointer-events: none;
        }

        /* Оптимизированный кинематографичный CRT-фильтр */
        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none !important;
            z-index: 2;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
                radial-gradient(circle, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.88) 100%);
            background-size: 100% 4px, 100% 100%;
            opacity: 0.82;
            transform: translateZ(0);
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 440px;
            pointer-events: auto;
        }

        /* Тяжелая композитная панель с текстурой шлифованного титана и карбона */
        .auth-card {
            position: relative;
            background: 
                /* Оптический блик верхнего прожектора */
                radial-gradient(circle at 50% -25%, rgba(0, 240, 255, 0.25) 0%, transparent 65%),
                /* Гексагональная микротекстура карбона */
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 4px),
                /* Глубокая база сплава титана */
                linear-gradient(165deg, #121626 0%, #080a13 45%, #030408 100%);
            border: 1.5px solid rgba(0, 240, 255, 0.45);
            border-radius: 22px;
            padding: 30px 24px 26px;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.95),
                0 0 45px rgba(0, 240, 255, 0.16),
                inset 0 1px 2px rgba(255, 255, 255, 0.3),
                inset 0 0 25px rgba(0, 0, 0, 0.9);
            text-align: center;
            clip-path: polygon(
                20px 0, calc(100% - 20px) 0, 
                100% 20px, 100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 20px 100%, 
                0 calc(100% - 20px), 0 20px
            );
        }

        /* Внешние оптические видоискатели HUD */
        .auth-card::before, .auth-card::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: rgba(0, 240, 255, 0.65);
            pointer-events: none;
        }
        .auth-card::before {
            top: 8px;
            left: 8px;
            border-top: 1.5px solid rgba(0, 240, 255, 0.65);
            border-left: 1.5px solid rgba(0, 240, 255, 0.65);
        }
        .auth-card::after {
            bottom: 8px;
            right: 8px;
            border-bottom: 1.5px solid rgba(0, 240, 255, 0.65);
            border-right: 1.5px solid rgba(0, 240, 255, 0.65);
        }

        /* Прецизионные крепежные винты */
        .corner-bolt {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #3d496a 20%, #090c15 90%);
            border: 1px solid rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 4px rgba(0, 240, 255, 0.3);
        }
        .bolt-tl { top: 9px; left: 9px; }
        .bolt-tr { top: 9px; right: 9px; }
        .bolt-bl { bottom: 9px; left: 9px; }
        .bolt-br { bottom: 9px; right: 9px; }

        /* Телеметрическая LED-панель */
        .system-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 9px;
            padding: 6px 14px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #8fa0c4;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 1.8s infinite alternate;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.4; }
            100% { opacity: 1; transform: scale(1.15); }
        }
        .system-code {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #00f0ff;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #e2eeff 55%, #8cb5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.4));
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: #6b7796;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        /* Центрированный слот официальной кнопки Google */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            margin: 0 auto;
            width: 100%;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.6));
        }

        /* Диагностический терминал */
        .terminal-log {
            margin-top: 20px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 9px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #00f0ff;
            letter-spacing: 1px;
            text-align: left;
            min-height: 44px;
            display: flex;
            align-items: center;
            word-break: break-word;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
        }

        .terminal-log::before {
            content: '>';
            color: #ff0077;
            margin-right: 8px;
            font-weight: bold;
        }

        .auth-footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #5d5d85;
            letter-spacing: 1px;
        }

        .auth-btn-link {
            color: #8c97ba;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            padding: 7px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .auth-btn-link.guest-highlight {
            color: #dbe8ff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .auth-btn-link.guest-highlight:hover {
            color: #00f0ff;
            border-color: rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
            transform: translateY(-1px);
        }

        .auth-btn-link:hover {
            color: #00f0ff;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div class="crt-overlay"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="corner-bolt bolt-tl"></div>
            <div class="corner-bolt bolt-tr"></div>
            <div class="corner-bolt bolt-bl"></div>
            <div class="corner-bolt bolt-br"></div>

            <!-- Телеметрия статуса соединения -->
            <div class="system-status-bar">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span>СЕТЬ АКТИВНА</span>
                </div>
                <div class="system-code">GIS // OAUTH_2.0</div>
            </div>

            <h1>ВХОД В АККАУНТ</h1>
            <div class="subtitle">СИНХРОНИЗАЦИЯ РЕКОРДОВ И ПРОГРЕССА</div>

            <!-- Официальная безопасная кнопка Google -->
            <div class="google-btn-wrapper" id="googleBtnSlot"></div>

            <div class="terminal-log" id="terminalStatus">
                Инициализация модуля Google...
            </div>

            <div class="auth-footer-links">
                <button class="auth-btn-link guest-highlight" id="btnGuest" onclick="guestSignIn()">[ ПРОДОЛЖИТЬ БЕЗ ВХОДА ► ]</button>
                <button class="auth-btn-link" id="btnStatus" onclick="serverStatus()">[ СТАТУС СЕТИ ]</button>
            </div>
        </div>
    </div>

<script>
// ==========================================
// ВАШ GOOGLE CLIENT ID
// ==========================================
const GOOGLE_CLIENT_ID = '706751433805-1r56qodllbmsqcg6hfcs8kk99vrgio34.apps.googleusercontent.com';
const terminalEl = document.getElementById('terminalStatus');

let audioCtx = null;
function playSound(type) {
    try {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'beep') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(750, now);
            osc.frequency.exponentialRampToValueAtTime(1150, now + 0.08);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'auth') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.linearRampToValueAtTime(880, now + 0.22);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
            osc.start(now); osc.stop(now + 0.22);
        }
    } catch(e) {}
}

function parseJwt(token) {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    } catch (e) {
        return null;
    }
}

function handleCredentialResponse(response) {
    if (response && response.credential) {
        terminalEl.style.color = '#ffd700';
        terminalEl.innerText = 'Токен подтвержден. Загрузка профиля...';

        const profile = parseJwt(response.credential);
        if (profile) {
            const userData = {
                name: profile.name || profile.email || 'Пользователь Google',
                email: profile.email || '',
                picture: profile.picture || '',
                sub: profile.sub,
                authType: 'google'
            };
            localStorage.setItem('cyber_jump_user', JSON.stringify(userData));
            
            playSound('auth');
            terminalEl.style.color = '#00ff88';
            terminalEl.innerText = `Вход выполнен: ${userData.name}`;

            setTimeout(() => {
                window.location.href = 'game.html';
            }, 550);
        } else {
            terminalEl.style.color = '#ff4d6d';
            terminalEl.innerText = 'Сбой расшифровки профиля';
        }
    }
}

function initGoogleAuth() {
    if (window.google && google.accounts && google.accounts.id) {
        try {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false,
                itp_support: true
            });

            const btnSlot = document.getElementById("googleBtnSlot");
            btnSlot.innerHTML = '';
            google.accounts.id.renderButton(btnSlot, {
                theme: "filled_black",
                size: "large",
                width: 320,
                shape: "rectangular",
                text: "signin_with",
                logo_alignment: "left"
            });

            terminalEl.style.color = '#00ff88';
            terminalEl.innerText = 'Готов к подключению учетной записи';
        } catch (err) {
            terminalEl.style.color = '#ffaa00';
            terminalEl.innerText = 'Проверьте порт http://localhost:8080 в Google Console';
        }
    }
}

window.addEventListener('load', () => {
    initGoogleAuth();
    const retry = setInterval(() => {
        if (window.google && google.accounts && google.accounts.id) {
            clearInterval(retry);
            initGoogleAuth();
        }
    }, 250);
});

// ПРЯМОЙ ПЕРЕХОД В GAME.HTML ПО КНОПКЕ ГОСТЬ
function guestSignIn() {
    playSound('beep');
    terminalEl.style.color = '#00f0ff';
    terminalEl.innerText = 'Вход без сохранения. Загрузка...';

    localStorage.setItem('cyber_jump_user', JSON.stringify({
        name: 'Гость',
        authType: 'guest'
    }));

    setTimeout(() => {
        window.location.href = 'game.html';[span_0](start_span)[span_0](end_span)
    }, 200);
}

function serverStatus() {
    playSound('beep');
    terminalEl.style.color = '#00ff88';
    terminalEl.innerText = `Хост: ${window.location.host || 'localhost'} // Пинг: 12ms`;
}

// ==========================================================
// УЛУЧШЕННЫЕ 3D МОДЕЛИ И ТЕКСТУРЫ КОСМОСА (CANVAS 60 FPS)
// ==========================================================
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let animTicks = 0;
let stars = [];
let giantStars = [];
let cosmicNebulae = [];
let particles = [];
let meteors = [];

// Модель фоновой космической станции
let orbitalStation = {
    angle: 0.2,
    orbitRadius: 210,
    rotSpeed: 0.008
};

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initCosmos();
}

function initCosmos() {
    stars = [];
    particles = [];
    meteors = [];

    // 1. Звезды глубокого космоса (спектральные классы O, B, A, M)
    for (let i = 0; i < 240; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() > 0.88 ? 2.6 : (Math.random() > 0.45 ? 1.6 : 1),
            color: Math.random() > 0.5 ? '#00f0ff' : (Math.random() > 0.25 ? '#a8bfff' : '#ffffff'),
            alpha: Math.random() * 0.85 + 0.15,
            blinkSpeed: Math.random() * 0.03 + 0.012
        });
    }

    // 2. Гигантские звезды с коронарными плазменными дугами
    giantStars = [
        {
            x: canvas.width * 0.12,
            y: canvas.height * 0.20,
            radius: 52,
            coreColor: '#ffffff',
            coronaColor: 'rgba(0, 240, 255, 0.4)',
            pulseSpeed: 0.02
        },
        {
            x: canvas.width * 0.88,
            y: canvas.height * 0.28,
            radius: 68,
            coreColor: '#f2f6ff',
            coronaColor: 'rgba(120, 160, 255, 0.32)',
            pulseSpeed: 0.024
        },
        {
            x: canvas.width * 0.68,
            y: canvas.height * 0.84,
            radius: 46,
            coreColor: '#fff5df',
            coronaColor: 'rgba(255, 150, 70, 0.28)',
            pulseSpeed: 0.03
        }
    ];

    // 3. Объемные туманности
    cosmicNebulae = [
        { x: canvas.width * 0.18, y: canvas.height * 0.24, radius: 340, color: 'rgba(0, 240, 255, ' },
        { x: canvas.width * 0.84, y: canvas.height * 0.30, radius: 380, color: 'rgba(80, 120, 255, ' },
        { x: canvas.width * 0.50, y: canvas.height * 0.75, radius: 440, color: 'rgba(100, 60, 200, ' },
        { x: canvas.width * 0.25, y: canvas.height * 0.80, radius: 320, color: 'rgba(255, 110, 0, ' }
    ];

    // 4. Плавающая фотонная пыль
    for (let i = 0; i < 75; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.45,
            vy: -Math.random() * 0.55 - 0.2,
            size: Math.random() * 2.4 + 1,
            color: Math.random() > 0.5 ? '#00f0ff' : '#9bb5ff',
            alpha: Math.random() * 0.65 + 0.25
        });
    }
}

// Отрисовка текстурированной модели планеты в левом нижнем секторе
function drawExoPlanet(px, py, radius) {
    ctx.save();
    
    // Внешняя атмосфера (Rayleigh Scattering)
    const atmoGrad = ctx.createRadialGradient(px, py, radius * 0.9, px, py, radius * 1.25);
    atmoGrad.addColorStop(0, 'rgba(0, 240, 255, 0.35)');
    atmoGrad.addColorStop(0.5, 'rgba(0, 150, 255, 0.12)');
    atmoGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = atmoGrad;
    ctx.beginPath();
    ctx.arc(px, py, radius * 1.25, 0, Math.PI * 2);
    ctx.fill();

    // Тело планеты с терминатором тени
    const planetGrad = ctx.createRadialGradient(px - radius * 0.35, py - radius * 0.35, radius * 0.1, px, py, radius);
    planetGrad.addColorStop(0, '#1a3350');
    planetGrad.addColorStop(0.5, '#0b1624');
    planetGrad.addColorStop(0.85, '#04070d');
    planetGrad.addColorStop(1, '#000205');

    ctx.fillStyle = planetGrad;
    ctx.beginPath();
    ctx.arc(px, py, radius, 0, Math.PI * 2);
    ctx.fill();

    // Текстурные полосы облаков и каньонов
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.12)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(px, py, radius - 6, 0.6, 2.2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(px, py, radius - 14, 0.3, 1.8);
    ctx.stroke();

    // Орбитальное кольцо станции
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.ellipse(px, py, orbitalStation.orbitRadius, orbitalStation.orbitRadius * 0.35, Math.PI / 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 3D Модель орбитальной станции на кольце
    orbitalStation.angle += orbitalStation.rotSpeed;
    const sx = px + Math.cos(orbitalStation.angle) * orbitalStation.orbitRadius;
    const sy = py + Math.sin(orbitalStation.angle) * (orbitalStation.orbitRadius * 0.35);

    // Модули станции
    ctx.fillStyle = '#e2eeff';
    ctx.fillRect(sx - 3, sy - 2, 6, 4);
    // Солнечные панели
    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(sx - 8, sy - 1, 4, 2);
    ctx.fillRect(sx + 4, sy - 1, 4, 2);
    // Сигнальный маяк станции
    if (animTicks % 30 < 15) {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(sx - 1, sy - 4, 2, 2);
    }

    ctx.restore();
}

function renderCosmos() {
    animTicks++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Глубокий градиент космоса
    const bgGrad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 40,
        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.88
    );
    bgGrad.addColorStop(0, '#040614');
    bgGrad.addColorStop(0.5, '#020309');
    bgGrad.addColorStop(1, '#000003');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Объемные туманности
    ctx.globalCompositeOperation = 'lighter';
    cosmicNebulae.forEach((neb, idx) => {
        const driftX = Math.sin(animTicks * 0.003 + idx * 1.5) * 20;
        const driftY = Math.cos(animTicks * 0.003 + idx * 1.5) * 15;
        const grad = ctx.createRadialGradient(neb.x + driftX, neb.y + driftY, 5, neb.x + driftX, neb.y + driftY, neb.radius);
        grad.addColorStop(0, neb.color + '0.22)');
        grad.addColorStop(0.5, neb.color + '0.06)');
        grad.addColorStop(1, neb.color + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(neb.x + driftX, neb.y + driftY, neb.radius, 0, Math.PI * 2);
        ctx.fill();
    });

    // Гигантские звезды с коронарными лучами
    giantStars.forEach(gs => {
        const pulse = Math.sin(animTicks * gs.pulseSpeed) * 5;
        const r = gs.radius + pulse;

        const sGrad = ctx.createRadialGradient(gs.x, gs.y, 2, gs.x, gs.y, r);
        sGrad.addColorStop(0, '#ffffff');
        sGrad.addColorStop(0.35, gs.coreColor);
        sGrad.addColorStop(0.8, gs.coronaColor);
        sGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = sGrad;
        ctx.beginPath();
        ctx.arc(gs.x, gs.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = gs.coronaColor;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(gs.x - r * 1.25, gs.y);
        ctx.lineTo(gs.x + r * 1.25, gs.y);
        ctx.moveTo(gs.x, gs.y - r * 1.25);
        ctx.lineTo(gs.x, gs.y + r * 1.25);
        ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';

    // Модель экзопланеты в левом нижнем углу
    drawExoPlanet(canvas.width * 0.16, canvas.height * 0.82, 75);

    // Звездное поле
    stars.forEach(st => {
        ctx.fillStyle = st.color;
        ctx.globalAlpha = st.alpha * (0.8 + Math.sin(animTicks * st.blinkSpeed) * 0.2);
        ctx.fillRect(st.x, st.y, st.size, st.size);
    });
    ctx.globalAlpha = 1.0;

    // Редкие пролетающие кометы
    if (Math.random() < 0.02) {
        meteors.push({
            x: Math.random() * canvas.width * 1.2 - 50,
            y: -30,
            vx: -4 - Math.random() * 5,
            vy: 5 + Math.random() * 6,
            life: 1.0
        });
    }

    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    meteors.forEach(m => {
        ctx.globalAlpha = m.life;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 3, m.y - m.vy * 3);
        ctx.stroke();
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.025;
    });
    meteors = meteors.filter(m => m.life > 0);
    ctx.globalAlpha = 1.0;

    // Плавающие фотонные частицы
    ctx.globalCompositeOperation = 'lighter';
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(renderCosmos);
}

window.addEventListener('resize', resize);
resize();
renderCosmos();
</script>
</body>
</html>
