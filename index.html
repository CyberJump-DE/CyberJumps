<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Jump: Авторизация и Синхронизация</title>
    <!-- Официальная библиотека Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010106;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
            pointer-events: none;
        }

        .crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none !important;
            z-index: 2;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
                radial-gradient(circle, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.88) 100%);
            background-size: 100% 4px, 100% 100%;
            opacity: 0.82;
            transform: translateZ(0);
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 92%;
            max-width: 440px;
            pointer-events: auto;
        }

        .auth-card {
            position: relative;
            background: 
                radial-gradient(circle at 50% -25%, rgba(0, 240, 255, 0.25) 0%, transparent 65%),
                repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 4px),
                repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0px, rgba(255, 255, 255, 0.012) 1px, transparent 1px, transparent 4px),
                linear-gradient(165deg, #121626 0%, #080a13 45%, #030408 100%);
            border: 1.5px solid rgba(0, 240, 255, 0.45);
            border-radius: 22px;
            padding: 30px 24px 26px;
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.95),
                0 0 45px rgba(0, 240, 255, 0.16),
                inset 0 1px 2px rgba(255, 255, 255, 0.3),
                inset 0 0 25px rgba(0, 0, 0, 0.9);
            text-align: center;
            clip-path: polygon(
                20px 0, calc(100% - 20px) 0, 
                100% 20px, 100% calc(100% - 20px), 
                calc(100% - 20px) 100%, 20px 100%, 
                0 calc(100% - 20px), 0 20px
            );
        }

        .auth-card::before, .auth-card::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: rgba(0, 240, 255, 0.65);
            pointer-events: none;
        }
        .auth-card::before {
            top: 8px;
            left: 8px;
            border-top: 1.5px solid rgba(0, 240, 255, 0.65);
            border-left: 1.5px solid rgba(0, 240, 255, 0.65);
        }
        .auth-card::after {
            bottom: 8px;
            right: 8px;
            border-bottom: 1.5px solid rgba(0, 240, 255, 0.65);
            border-right: 1.5px solid rgba(0, 240, 255, 0.65);
        }

        .corner-bolt {
            position: absolute;
            width: 8px;
            height: 8px;
            background: radial-gradient(circle, #3d496a 20%, #090c15 90%);
            border: 1px solid rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 4px rgba(0, 240, 255, 0.3);
        }
        .bolt-tl { top: 9px; left: 9px; }
        .bolt-tr { top: 9px; right: 9px; }
        .bolt-bl { bottom: 9px; left: 9px; }
        .bolt-br { bottom: 9px; right: 9px; }

        .system-status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 9px;
            padding: 6px 14px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #8fa0c4;
            letter-spacing: 1px;
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 1.8s infinite alternate;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.4; }
            100% { opacity: 1; transform: scale(1.15); }
        }
        .system-code {
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #00f0ff;
            letter-spacing: 1px;
            text-shadow: 0 0 6px rgba(0, 240, 255, 0.5);
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 0%, #e2eeff 55%, #8cb5ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.4));
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 2px;
            color: #6b7796;
            margin-bottom: 24px;
            text-transform: uppercase;
        }

        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            margin: 0 auto;
            width: 100%;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.6));
        }

        .terminal-log {
            margin-top: 20px;
            padding: 12px 14px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px dashed rgba(0, 240, 255, 0.3);
            border-radius: 9px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #00f0ff;
            letter-spacing: 1px;
            text-align: left;
            min-height: 48px;
            display: flex;
            align-items: center;
            word-break: break-word;
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
            line-height: 1.4;
        }

        .terminal-log::before {
            content: '>';
            color: #ff0077;
            margin-right: 8px;
            font-weight: bold;
        }

        .auth-footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #5d5d85;
            letter-spacing: 1px;
        }

        .auth-btn-link {
            color: #8c97ba;
            background: transparent;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            padding: 7px 12px;
            border-radius: 6px;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .auth-btn-link.guest-highlight {
            color: #dbe8ff;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .auth-btn-link.guest-highlight:hover {
            color: #00f0ff;
            border-color: rgba(0, 240, 255, 0.5);
            background: rgba(0, 240, 255, 0.12);
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.35);
            transform: translateY(-1px);
        }

        .auth-btn-link:hover {
            color: #00f0ff;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>
    <div class="crt-overlay"></div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="corner-bolt bolt-tl"></div>
            <div class="corner-bolt bolt-tr"></div>
            <div class="corner-bolt bolt-bl"></div>
            <div class="corner-bolt bolt-br"></div>

            <div class="system-status-bar">
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span id="syncNetStatus">СЕТЬ АКТИВНА</span>
                </div>

            </div>

            <h1>ВХОД В АККАУНТ</h1>
            <div class="subtitle">СИНХРОНИЗАЦИЯ РЕКОРДОВ И ПРОГРЕССА</div>

            <!-- Официальная кнопка Google -->
            <div class="google-btn-wrapper" id="googleBtnSlot"></div>

            <div class="terminal-log" id="terminalStatus">
                Инициализация модуля авторизации и синхронизации...
            </div>

            <div class="auth-footer-links">
                <button class="auth-btn-link guest-highlight" id="btnGuest" onclick="guestSignIn()">[ ПРОДОЛЖИТЬ БЕЗ ВХОДА ► ]</button>
                <button class="auth-btn-link" id="btnStatus" onclick="serverStatus()">[ СТАТУС СЕТИ ]</button>
            </div>
        </div>
    </div>

<script>
// ==========================================================
// КОНФИГУРАЦИЯ И КЛИЕНТ GOOGLE OAUTH
// ==========================================================
const GOOGLE_CLIENT_ID = '706751433805-1r56qodllbmsqcg6hfcs8kk99vrgio34.apps.googleusercontent.com';
const terminalEl = document.getElementById('terminalStatus');
const syncNetStatusEl = document.getElementById('syncNetStatus');

// --- ЗВУКОВОЙ ДВИЖОК ---
let audioCtx = null;
function playSound(type) {
    try {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'beep') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(750, now);
            osc.frequency.exponentialRampToValueAtTime(1150, now + 0.08);
            gain.gain.setValueAtTime(0.09, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
            osc.start(now); osc.stop(now + 0.08);
        } else if (type === 'auth') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.linearRampToValueAtTime(880, now + 0.22);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.22);
            osc.start(now); osc.stop(now + 0.22);
        }
    } catch(e) {}
}

// ==========================================================
// МОДУЛЬ СИНХРОНИЗАЦИИ ПРОГРЕССА (CLOUDSYNC MANAGER)
// ==========================================================
const CloudSyncManager = {
    // Собирает текущее состояние игры с устройства
    getLocalSnapshot() {
        return {
            crystals: parseInt(localStorage.getItem('cyber_jump_crystals') || '0', 10),
            highScore: parseInt(localStorage.getItem('cyber_jump_hs') || '0', 10),
            unlockedHats: JSON.parse(localStorage.getItem('cyber_jump_unlocked_hats') || '["none","crown"]'),
            unlockedEyes: JSON.parse(localStorage.getItem('cyber_jump_unlocked_eyes') || '["default","pixel"]'),
            unlockedAuras: JSON.parse(localStorage.getItem('cyber_jump_unlocked_auras') || '["none"]'),
            equippedHat: localStorage.getItem('cyber_jump_hat') || 'none',
            equippedEye: localStorage.getItem('cyber_jump_eye') || 'default',
            equippedAura: localStorage.getItem('cyber_jump_aura') || 'none',
            equippedColor: localStorage.getItem('cyber_jump_color') || '#00f0ff',
            audioSettings: JSON.parse(localStorage.getItem('cyber_jump_audio_settings') || '{"master":80,"sfx":90,"synth":70,"ui":85}'),
            graphicsTier: localStorage.getItem('cyber_jump_graphics_tier') || 'medium',
            customBinds: JSON.parse(localStorage.getItem('cyber_jump_binds') || '{"left":"KeyA","right":"KeyD","shoot":"KeyE","trap":"Space"}'),
            lastSaved: parseInt(localStorage.getItem('cyber_jump_last_save') || '0', 10)
        };
    },

    // Применяет снимок в активные ключи игры для game.html
    applySnapshot(data) {
        if (!data) return;
        if (data.crystals !== undefined) localStorage.setItem('cyber_jump_crystals', data.crystals);
        if (data.highScore !== undefined) localStorage.setItem('cyber_jump_hs', data.highScore);
        if (data.unlockedHats) localStorage.setItem('cyber_jump_unlocked_hats', JSON.stringify(data.unlockedHats));
        if (data.unlockedEyes) localStorage.setItem('cyber_jump_unlocked_eyes', JSON.stringify(data.unlockedEyes));
        if (data.unlockedAuras) localStorage.setItem('cyber_jump_unlocked_auras', JSON.stringify(data.unlockedAuras));
        if (data.equippedHat) localStorage.setItem('cyber_jump_hat', data.equippedHat);
        if (data.equippedEye) localStorage.setItem('cyber_jump_eye', data.equippedEye);
        if (data.equippedAura) localStorage.setItem('cyber_jump_aura', data.equippedAura);
        if (data.equippedColor) localStorage.setItem('cyber_jump_color', data.equippedColor);
        if (data.audioSettings) localStorage.setItem('cyber_jump_audio_settings', JSON.stringify(data.audioSettings));
        if (data.graphicsTier) localStorage.setItem('cyber_jump_graphics_tier', data.graphicsTier);
        if (data.customBinds) localStorage.setItem('cyber_jump_binds', JSON.stringify(data.customBinds));
        localStorage.setItem('cyber_jump_last_save', Date.now());
    },

    // Умное объединение двух сохранений без потери предметов и кристаллов
    mergeSnapshots(localData, cloudData) {
        if (!cloudData) return localData;
        return {
            crystals: Math.max(localData.crystals || 0, cloudData.crystals || 0),
            highScore: Math.max(localData.highScore || 0, cloudData.highScore || 0),
            unlockedHats: Array.from(new Set([...(localData.unlockedHats || []), ...(cloudData.unlockedHats || [])])),
            unlockedEyes: Array.from(new Set([...(localData.unlockedEyes || []), ...(cloudData.unlockedEyes || [])])),
            unlockedAuras: Array.from(new Set([...(localData.unlockedAuras || []), ...(cloudData.unlockedAuras || [])])),
            equippedHat: cloudData.equippedHat || localData.equippedHat || 'none',
            equippedEye: cloudData.equippedEye || localData.equippedEye || 'default',
            equippedAura: cloudData.equippedAura || localData.equippedAura || 'none',
            equippedColor: cloudData.equippedColor || localData.equippedColor || '#00f0ff',
            audioSettings: cloudData.audioSettings || localData.audioSettings,
            graphicsTier: cloudData.graphicsTier || localData.graphicsTier || 'medium',
            customBinds: cloudData.customBinds || localData.customBinds,
            lastSaved: Date.now()
        };
    },

    // Получает облачный профиль пользователя по уникальному Google Sub ID
    async fetchCloudProfile(userId) {
        const cloudKey = `cyber_jump_cloud_profile_${userId}`;
        const stored = localStorage.getItem(cloudKey);
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch(e) {
                return null;
            }
        }
        return null;
    },

    // Записывает актуальный слепок в изолированное хранилище аккаунта
    async pushCloudProfile(userId, mergedData) {
        const cloudKey = `cyber_jump_cloud_profile_${userId}`;
        localStorage.setItem(cloudKey, JSON.stringify(mergedData));
    },

    // Полный цикл синхронизации при входе
    async syncUserAccount(profile) {
        const userId = profile.sub || profile.id;
        terminalEl.style.color = '#ffd700';
        terminalEl.innerText = `ПОДКЛЮЧЕНИЕ К ОБЛАКУ ДЛЯ [${profile.name || 'USER'}]...`;

        // 1. Читаем локальное и облачное состояние
        const localSnap = this.getLocalSnapshot();
        const cloudSnap = await this.fetchCloudProfile(userId);

        // 2. Объединяем прогресс (вещи, рекорды, валюту)
        const mergedSnap = this.mergeSnapshots(localSnap, cloudSnap);

        // 3. Сохраняем в облачный профиль и в активную память игры
        await this.pushCloudProfile(userId, mergedSnap);
        this.applySnapshot(mergedSnap);

        // 4. Записываем профиль авторизованного игрока
        const activeUser = {
            name: profile.name || profile.email || 'Пилот',
            email: profile.email || '',
            picture: profile.picture || '',
            sub: userId,
            authType: 'google',
            syncedAt: Date.now()
        };
        localStorage.setItem('cyber_jump_user', JSON.stringify(activeUser));

        const totalItems = (mergedSnap.unlockedHats.length - 1) + (mergedSnap.unlockedEyes.length - 1) + (mergedSnap.unlockedAuras.length - 1);
        return {
            crystals: mergedSnap.crystals,
            highScore: mergedSnap.highScore,
            itemsCount: Math.max(0, totalItems)
        };
    }
};

// Расшифровка JWT токена Google
function parseJwt(token) {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
    } catch (e) {
        return null;
    }
}

// Колбэк от Google Identity Services
async function handleCredentialResponse(response) {
    if (response && response.credential) {
        terminalEl.style.color = '#ffd700';
        terminalEl.innerText = 'ТОКЕН ПРИНЯТ. ПРОВЕРКА ОБЛАЧНОГО СЛЕПКА...';

        const profile = parseJwt(response.credential);
        if (profile) {
            try {
                // Запуск полной синхронизации прогресса
                const syncSummary = await CloudSyncManager.syncUserAccount(profile);

                playSound('auth');
                terminalEl.style.color = '#00ff88';
                terminalEl.innerText = `УСПЕШНО: ${profile.name.toUpperCase()} // 💎 ${syncSummary.crystals} | 🏆 ${syncSummary.highScore}M | ВЕЩЕЙ: ${syncSummary.itemsCount}`;

                if (syncNetStatusEl) {
                    syncNetStatusEl.innerText = 'ОБЛАКО: СИНХРОНИЗИРОВАНО';
                    syncNetStatusEl.style.color = '#00ff88';
                }

                setTimeout(() => {
                    window.location.href = 'game.html';
                }, 750);
            } catch (err) {
                terminalEl.style.color = '#ff4d6d';
                terminalEl.innerText = 'ОШИБКА СИНХРОНИЗАЦИИ ПРОГРЕССА: ПЕРЕХОД С ЛОКАЛЬНЫМИ ДАННЫМИ...';
                setTimeout(() => {
                    window.location.href = 'game.html';
                }, 800);
            }
        } else {
            terminalEl.style.color = '#ff4d6d';
            terminalEl.innerText = 'СБОЙ ДЕШИФРОВКИ ДАННЫХ УЧЕТНОЙ ЗАПИСИ';
        }
    }
}

function initGoogleAuth() {
    if (window.google && google.accounts && google.accounts.id) {
        try {
            google.accounts.id.initialize({
                client_id: GOOGLE_CLIENT_ID,
                callback: handleCredentialResponse,
                auto_select: false,
                itp_support: true
            });

            const btnSlot = document.getElementById("googleBtnSlot");
            btnSlot.innerHTML = '';
            google.accounts.id.renderButton(btnSlot, {
                theme: "filled_black",
                size: "large",
                width: 320,
                shape: "rectangular",
                text: "signin_with",
                logo_alignment: "left"
            });

            terminalEl.style.color = '#00ff88';
            terminalEl.innerText = 'ШЛЮЗ ГОТОВ: ОЖИДАНИЕ ВХОДА И СИНХРОНИЗАЦИИ...';
        } catch (err) {
            terminalEl.style.color = '#ffaa00';
            terminalEl.innerText = 'ОШИБКА ИНИЦИАЛИЗАЦИИ: ПРОВЕРЬТЕ НАСТРОЙКИ В GOOGLE CONSOLE';
        }
    }
}

window.addEventListener('load', () => {
    initGoogleAuth();
    const retry = setInterval(() => {
        if (window.google && google.accounts && google.accounts.id) {
            clearInterval(retry);
            initGoogleAuth();
        }
    }, 250);
});

// ГОСТЕВОЙ ВХОД (НЕ СБИВАЕТ ОБЛАЧНЫЙ ПРОФИЛЬ)
function guestSignIn() {
    playSound('beep');
    terminalEl.style.color = '#00f0ff';
    terminalEl.innerText = 'ВХОД В РЕЖИМЕ ГОСТЯ [ЛОКАЛЬНЫЙ ПРОФИЛЬ]...';

    localStorage.setItem('cyber_jump_user', JSON.stringify({
        name: 'Гость',
        authType: 'guest'
    }));

    setTimeout(() => {
        window.location.href = 'game.html';
    }, 200);
}

function serverStatus() {
    playSound('beep');
    terminalEl.style.color = '#00ff88';
    terminalEl.innerText = `СЕТЬ: ОНЛАЙН [${window.location.host || 'GITHUB_PAGES'}] // CLOUD_SYNC OK`;
}

// ==========================================================
// ГЛУБОКИЙ КОСМИЧЕСКИЙ CANVAS (САТУРН, ЧЕРНАЯ ДЫРА И ЗВЕЗДЫ)
// ==========================================================
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');

let animTicks = 0;
let stars = [];
let meteors = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    initCosmos();
}

function initCosmos() {
    stars = [];
    meteors = [];

    for (let i = 0; i < 220; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() > 0.85 ? 2.6 : (Math.random() > 0.45 ? 1.6 : 1),
            color: Math.random() > 0.5 ? '#00f0ff' : (Math.random() > 0.25 ? '#a8bfff' : '#ffffff'),
            alpha: Math.random() * 0.85 + 0.15,
            blinkSpeed: Math.random() * 0.03 + 0.012
        });
    }
}

// Сатурн
function drawSaturn(sx, sy, radius) {
    ctx.save();
    ctx.translate(sx, sy);

    ctx.strokeStyle = 'rgba(230, 200, 140, 0.75)';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 2.2, radius * 0.5, Math.PI / 6, Math.PI, Math.PI * 2);
    ctx.stroke();

    const grad = ctx.createRadialGradient(-10, -10, 5, 0, 0, radius);
    grad.addColorStop(0, '#ffeaa7');
    grad.addColorStop(0.7, '#dfe6e9');
    grad.addColorStop(1, '#fdcb6e');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(230, 200, 140, 0.9)';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.ellipse(0, 0, radius * 2.2, radius * 0.5, Math.PI / 6, 0, Math.PI);
    ctx.stroke();

    ctx.restore();
}

// Черная дыра
function drawBlackHole(bx, by, radius) {
    ctx.save();
    ctx.translate(bx, by);
    const spin = animTicks * 0.035;

    ctx.globalCompositeOperation = 'lighter';
    const diskGrad = ctx.createRadialGradient(0, 0, radius * 0.8, 0, 0, radius * 2.8);
    diskGrad.addColorStop(0, 'rgba(255, 240, 200, 0.85)');
    diskGrad.addColorStop(0.3, 'rgba(255, 120, 0, 0.65)');
    diskGrad.addColorStop(0.65, 'rgba(180, 0, 255, 0.35)');
    diskGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');

    ctx.save();
    ctx.rotate(0.35);
    ctx.scale(1.0, 0.42);
    ctx.fillStyle = diskGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 2.8, 0, Math.PI * 2);
    ctx.fill();

    ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
        const a = spin + (i * Math.PI) / 2;
        ctx.strokeStyle = i % 2 === 0 ? 'rgba(255, 200, 50, 0.55)' : 'rgba(0, 240, 255, 0.45)';
        ctx.beginPath();
        ctx.arc(0, 0, radius * (1.3 + i * 0.35), a, a + 1.6);
        ctx.stroke();
    }
    ctx.restore();

    const ringGrad = ctx.createRadialGradient(0, 0, radius * 0.9, 0, 0, radius * 1.35);
    ringGrad.addColorStop(0, '#ffffff');
    ringGrad.addColorStop(0.5, '#ffd700');
    ringGrad.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = ringGrad;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 1.35, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000003';
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, 0, radius + 0.5, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}

function renderCosmos() {
    animTicks++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const bgGrad = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, 40,
        canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.88
    );
    bgGrad.addColorStop(0, '#040614');
    bgGrad.addColorStop(0.5, '#020309');
    bgGrad.addColorStop(1, '#000003');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Туманности
    ctx.globalCompositeOperation = 'lighter';
    const nebulae = [
        { x: canvas.width * 0.22, y: canvas.height * 0.22, r: 240, col: 'rgba(0, 240, 255, ' },
        { x: canvas.width * 0.78, y: canvas.height * 0.32, r: 260, col: 'rgba(180, 0, 255, ' }
    ];
    nebulae.forEach(n => {
        const grad = ctx.createRadialGradient(n.x, n.y, 10, n.x, n.y, n.r);
        grad.addColorStop(0, n.col + '0.22)');
        grad.addColorStop(1, n.col + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
        ctx.fill();
    });

    // Гигантские светила с коронами
    const spacedStars = [
        { x: canvas.width * 0.14, y: canvas.height * 0.34, r: 24, core: '#ffffff', corona: 'rgba(0, 240, 255, 0.45)', speed: 0.03 },
        { x: canvas.width * 0.86, y: canvas.height * 0.14, r: 28, core: '#fff4b8', corona: 'rgba(255, 0, 119, 0.40)', speed: 0.025 }
    ];
    spacedStars.forEach(gs => {
        const pulse = Math.sin(animTicks * gs.speed) * 4;
        const curR = gs.r + pulse;
        const sGrad = ctx.createRadialGradient(gs.x, gs.y, 2, gs.x, gs.y, curR);
        sGrad.addColorStop(0, '#ffffff');
        sGrad.addColorStop(0.4, gs.core);
        sGrad.addColorStop(1, gs.corona);

        ctx.fillStyle = sGrad;
        ctx.beginPath();
        ctx.arc(gs.x, gs.y, curR, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = gs.corona;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(gs.x - curR * 1.5, gs.y);
        ctx.lineTo(gs.x + curR * 1.5, gs.y);
        ctx.moveTo(gs.x, gs.y - curR * 1.5);
        ctx.lineTo(gs.x, gs.y + curR * 1.5);
        ctx.stroke();
    });
    ctx.globalCompositeOperation = 'source-over';

    // Звезды
    stars.forEach(st => {
        ctx.fillStyle = st.color;
        ctx.globalAlpha = st.alpha * (0.8 + Math.sin(animTicks * st.blinkSpeed) * 0.25);
        ctx.fillRect(st.x, st.y, st.size, st.size);
    });
    ctx.globalAlpha = 1.0;

    // Сатурн (справа) и Черная Дыра (слева)
    drawSaturn(canvas.width * 0.82, canvas.height * 0.24, 52);
    drawBlackHole(canvas.width * 0.24, canvas.height * 0.25, 26);

    // Кометы
    if (Math.random() < 0.02) {
        meteors.push({
            x: Math.random() * canvas.width * 1.2 - 50,
            y: -30,
            vx: -4 - Math.random() * 5,
            vy: 5 + Math.random() * 6,
            life: 1.0
        });
    }
    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    meteors.forEach(m => {
        ctx.globalAlpha = m.life;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 3, m.y - m.vy * 3);
        ctx.stroke();
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.025;
    });
    meteors = meteors.filter(m => m.life > 0);
    ctx.globalAlpha = 1.0;

    requestAnimationFrame(renderCosmos);
}

window.addEventListener('resize', resize);
resize();
renderCosmos();
</script>
