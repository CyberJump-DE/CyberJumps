<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Jump: Deep Cosmos Edition + DevTools</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #010106;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 960px;
            max-height: 100%;
            overflow: hidden;
            background: #050515;
            box-shadow: 0 0 90px rgba(0, 240, 255, 0.5);
            border-left: 2px solid rgba(0, 240, 255, 0.6);
            border-right: 2px solid rgba(0, 240, 255, 0.6);
            contain: layout paint size;
        }

        /* CRT Эффект */
        #gameContainer::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                        radial-gradient(circle, rgba(0,0,0,0) 60%, rgba(0,0,0,0.85) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 4;
            pointer-events: none;
            opacity: 0.75;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(3, 3, 18, 0.94);
            z-index: 10;
            transition: opacity 0.25s ease, transform 0.25s ease;
            transform: translateZ(0);
            will-change: transform, opacity;
        }
        
        .overlay.menu-transparent {
            background: radial-gradient(circle at 50% 35%, rgba(15, 10, 35, 0.25) 0%, rgba(2, 2, 8, 0.65) 100%);
        }

        /* Полное устранение фантомных кликов */
        .hidden, .hidden * {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
        .hidden {
            transform: scale(0.96) translateZ(0);
        }

        .glass-card {
            background: linear-gradient(135deg, rgba(22, 22, 54, 0.96), rgba(8, 8, 26, 0.98));
            border: 2px solid rgba(0, 240, 255, 0.7);
            border-radius: 24px;
            padding: 26px 22px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.3);
            text-align: center;
            width: 90%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateZ(0);
        }

        h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(45deg, #00f0ff, #ff0077, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 12px rgba(0, 240, 255, 0.8));
        }

        p.subtitle {
            font-size: 10px;
            color: #8c8cb8;
            margin-bottom: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu-btn {
            width: 100%;
            padding: 14px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(90deg, #ff0055, #7a00ff);
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.15s ease;
            margin-bottom: 10px;
        }
        .menu-btn:active {
            transform: scale(0.95);
        }

        /* --- UI ГЛАВНОГО МЕНЮ --- */
        .menu-header-bar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 12;
        }
        .menu-badge {
            background: rgba(8, 12, 28, 0.88);
            border: 1px solid rgba(0, 240, 255, 0.45);
            padding: 7px 14px;
            border-radius: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #00f0ff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 12px rgba(0, 240, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateZ(0);
        }
        .menu-badge-dot {
            width: 7px;
            height: 7px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse-dot 1.8s infinite alternate;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .menu-title-wrap {
            text-align: center;
            position: absolute;
            top: 13%;
            width: 100%;
            pointer-events: none;
            transform: translateZ(0);
        }
        .cyber-glitch-title {
            font-size: clamp(34px, 7vw, 48px);
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(180deg, #ffffff 0%, #00f0ff 50%, #ff0077 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.6));
            margin-bottom: 4px;
        }
        .cyber-subtag {
            display: inline-block;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            letter-spacing: 5px;
            color: #00f0ff;
            padding: 4px 14px;
            background: rgba(5, 8, 22, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 4px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.7);
        }

        .menu-controls-tip {
            position: absolute;
            bottom: 136px;
            left: 50%;
            transform: translateX(-50%) translateZ(0);
            background: rgba(8, 8, 22, 0.85);
            border: 1px solid rgba(0, 240, 255, 0.25);
            padding: 6px 16px;
            border-radius: 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: #a0a0cc;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            pointer-events: none;
            white-space: nowrap;
        }
        .menu-controls-tip span {
            color: #00f0ff;
            font-weight: bold;
        }

        .main-menu-footer {
            position: absolute;
            bottom: 22px;
            left: 0;
            width: 100%;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 12;
            transform: translateZ(0);
        }
        .main-menu-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .cyber-action-btn {
            position: relative;
            flex: 1;
            padding: 14px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            border: none;
            transform: translateZ(0);
            will-change: transform;
        }
        .cyber-action-btn.play-btn {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.9), rgba(122, 0, 255, 0.95));
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 240, 255, 0.5);
            border-left: 3px solid #00f0ff;
        }
        .cyber-action-btn.play-btn:hover {
            transform: translateY(-2px) scale(1.01) translateZ(0);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7), 0 0 35px rgba(0, 240, 255, 0.8);
            background: linear-gradient(135deg, #00f0ff, #9900ff);
        }
        .cyber-action-btn.skin-btn {
            background: linear-gradient(135deg, rgba(255, 0, 119, 0.85), rgba(122, 0, 255, 0.9));
            border-left: 3px solid #ff0077;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 15px rgba(255, 0, 119, 0.4);
        }
        .cyber-action-btn.skin-btn:hover {
            transform: translateY(-2px) scale(1.01) translateZ(0);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7), 0 0 25px rgba(255, 0, 119, 0.7);
        }
        .cyber-action-btn:active {
            transform: scale(0.96) translateZ(0);
        }

        .cyber-action-btn.disabled {
            background: rgba(12, 12, 26, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #555577;
            cursor: not-allowed;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        /* --- КАСТОМИЗАЦИЯ --- */
        .custom-section-title {
            font-size: 11px;
            color: #00f0ff;
            letter-spacing: 2px;
            margin: 12px 0 8px 0;
            text-align: left;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }
        .custom-preview-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(5, 5, 20, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.3);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .color-swatches-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .color-chip {
            width: 100%;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }
        .color-chip:hover {
            transform: scale(1.08);
        }
        .color-chip.active {
            border-color: #fff;
            transform: scale(1.12);
            box-shadow: 0 0 15px currentColor;
        }

        .hats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .hat-slot {
            position: relative;
            height: 52px;
            background: rgba(12, 12, 32, 0.75);
            border: 1px dashed rgba(0, 240, 255, 0.35);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            opacity: 0.5;
            cursor: not-allowed;
            transition: all 0.2s ease;
        }
        .hat-slot.available {
            opacity: 1;
            cursor: pointer;
            border: 1.5px solid rgba(0, 240, 255, 0.65);
            background: rgba(18, 20, 48, 0.85);
        }
        .hat-slot.available:hover {
            transform: scale(1.06);
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }
        .hat-slot.available.active {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.18);
            box-shadow: 0 0 18px rgba(255, 215, 0, 0.65);
        }
        .hat-slot .lock-tag {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
        }

        /* DEV TOOLS СТИЛИ */
        .dev-panel {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed rgba(0, 240, 255, 0.4);
            text-align: left;
        }
        .dev-title {
            font-size: 12px;
            color: #ffff00;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: bold;
        }
        .dev-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .dev-btn {
            padding: 10px 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: 700;
            color: #00f0ff;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.5);
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .dev-btn.active {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        #topControls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 6;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            background: rgba(12, 12, 30, 0.9);
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            border-radius: 12px;
            color: #00f0ff;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            transition: all 0.2s ease;
            transform: translateZ(0);
        }
        .icon-btn:hover {
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            z-index: 5;
        }
        .hud-panel {
            background: rgba(10, 10, 28, 0.88);
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            padding: 8px 16px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 240, 255, 0.2);
            transform: translateZ(0);
        }
        .score-box {
            font-size: 22px;
            font-weight: 900;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0,240,255,0.8);
        }
        .highscore-box {
            font-size: 9px;
            color: #ff00bb;
            letter-spacing: 1px;
        }

        .controls-layer {
            position: absolute;
            bottom: 18px;
            left: 0;
            width: 100%;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            transform: translateZ(0);
        }
        .dir-buttons {
            display: flex;
            gap: 14px;
            pointer-events: auto;
        }
        .btn {
            width: 64px;
            height: 64px;
            background: rgba(12, 12, 30, 0.9);
            border: 1.5px solid rgba(0, 240, 255, 0.5);
            border-radius: 16px;
            color: #fff;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            transform: translateZ(0);
        }
        .btn-shoot {
            width: 90px;
            height: 64px;
            border-color: #ff0055;
            background: rgba(255, 0, 85, 0.35);
            color: #ff0055;
            font-weight: 900;
            font-size: 14px;
            pointer-events: auto;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
        }
        .btn:active {
            transform: scale(0.9) translateZ(0);
            background: rgba(0, 240, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="mainMenu" class="overlay menu-transparent">
            <div class="menu-header-bar">
                <div class="menu-badge">
                    <div class="menu-badge-dot"></div>
                    <span>SYS: ONLINE // BEST: <strong id="menuHighScore" style="color:#fff;">0</strong> M</span>
                </div>
                <div class="icon-btn" id="menuSoundToggle" title="Звук">🔊</div>
            </div>

            <div class="menu-title-wrap">
                <div class="cyber-glitch-title">CYBER JUMP</div>
                <div class="cyber-subtag">DEEP COSMOS // v2.026</div>
            </div>

            <div class="menu-controls-tip">
                <span>[A / D]</span> ДВИЖЕНИЕ • <span>[E]</span> ОГОНЬ • <span>[ENTER]</span> СТАРТ
            </div>

            <div class="main-menu-footer">
                <button class="cyber-action-btn play-btn" onclick="startFromMainMenu()">
                    ЗАПУСК СИСТЕМЫ ►
                </button>
                <div class="main-menu-row">
                    <button class="cyber-action-btn skin-btn" onclick="openCustomMenu()">
                        КАСТОМИЗАЦИЯ 🎨
                    </button>
                    <button class="cyber-action-btn disabled" disabled>
                        СЕТЬ 🔒 (DEV)
                    </button>
                </div>
            </div>
        </div>

        <!-- МЕНЮ КАСТОМИЗАЦИИ -->
        <div id="customMenu" class="overlay hidden">
            <div class="glass-card">
                <h1>ГАРДЕРОБ</h1>
                <p class="subtitle">МОДИФИКАЦИЯ СКАФАНДРА</p>

                <div class="custom-preview-wrap">
                    <canvas id="skinPreviewCanvas" width="100" height="80"></canvas>
                </div>

                <div class="custom-section-title">
                    <span>ЦВЕТ СКАФАНДРА</span>
                    <span id="currentColorLabel" style="color:#fff;">CYAN</span>
                </div>
                <div class="color-swatches-grid" id="colorSwatches">
                    <!-- Заполняется динамически -->
                </div>

                <div class="custom-section-title">
                    <span>ШАПКИ</span>
                    <span id="hatStatusLabel" style="color:#00ff88;">1 / 8 ДОСТУПНО</span>
                </div>
                <div class="hats-grid">
                    <!-- 1-я ячейка: активная корона -->
                    <div class="hat-slot available" id="slotCrown" onclick="toggleCrownHat()" title="Пиксельная Корона">
                        👑
                    </div>
                    <!-- Остальные 7 заблокированы -->
                    <div class="hat-slot" title="Каска">🪖<span class="lock-tag">🔒</span></div>
                    <div class="hat-slot" title="Кепка">🧢<span class="lock-tag">🔒</span></div>
                    <div class="hat-slot" title="Наушники">🎧<span class="lock-tag">🔒</span></div>
                    <div class="hat-slot" title="Рога">😈<span class="lock-tag">🔒</span></div>
                    <div class="hat-slot" title="Цилиндр">🎩<span class="lock-tag">🔒</span></div>
                    <div class="hat-slot" title="Очки">🕶️<span class="lock-tag">🔒</span></div>
                    <div class="hat-slot" title="Нимб">😇<span class="lock-tag">🔒</span></div>
                </div>

                <button class="menu-btn" onclick="closeCustomMenu()">СОХРАНИТЬ И ВЫЙТИ</button>
            </div>
        </div>

        <div id="topControls" style="display: none;">
            <div class="icon-btn" id="btnSound">🔊</div>
            <div class="icon-btn" id="btnPause">⏸️</div>
        </div>

        <div id="hud" style="display: none;">
            <div class="hud-panel">
                <div class="score-box"><span id="score">0</span> m</div>
                <div class="highscore-box">РЕКОРД: <span id="highScore">0</span> m</div>
            </div>
        </div>

        <!-- МЕНЮ ПАУЗЫ (6 КНОПОК) -->
        <div id="pauseMenu" class="overlay hidden">
            <div class="glass-card">
                <h1>ПАУЗА</h1>
                <button class="menu-btn" onclick="togglePause()">ПРОДОЛЖИТЬ</button>
                <button class="menu-btn" onclick="goToMainMenu()" style="background: linear-gradient(90deg, #00f0ff, #0066ff); box-shadow: 0 0 20px rgba(0, 240, 255, 0.45); margin-bottom: 15px;">В МЕНЮ</button>

                <div class="dev-panel">
                    <div class="dev-title">⚙️ DEV TOOLS / ЧИТЫ</div>
                    <div class="dev-grid">
                        <button class="dev-btn" id="devNoclip" onclick="toggleDevOption('noclip')">NOCLIP: OFF</button>
                        <button class="dev-btn" id="devGodMode" onclick="toggleDevOption('godmode')">GOD MODE: OFF</button>
                        <button class="dev-btn" onclick="triggerDevAction('jetpack')">🚀 JETPACK</button>
                        <button class="dev-btn" onclick="triggerDevAction('teleport')">🌌 +1000 METERS</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="gameOverMenu" class="overlay hidden">
            <div class="glass-card">
                <h1 style="background: linear-gradient(45deg, #ff0055, #ff5500); -webkit-background-clip: text;">СИСТЕМНЫЙ СБОЙ!</h1>
                <p class="subtitle">ВЫСОТА: <span id="finalScore" style="color:#00f0ff; font-weight:900;">0</span> m</p>
                <button class="menu-btn" onclick="startGame()">ПОВТОРИТЬ</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls-layer" style="display: none;">
            <div class="dir-buttons">
                <div class="btn" id="btnLeft">◄</div>
                <div class="btn" id="btnRight">►</div>
            </div>
            <div class="btn btn-shoot" id="btnShoot">FIRE 🚀</div>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d'); // Исправлено: удален артефакт alpha: false, вызывавший наслоение кадров

const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const menuHighScoreEl = document.getElementById('menuHighScore');
const finalScoreEl = document.getElementById('finalScore');

const mainMenu = document.getElementById('mainMenu');
const customMenu = document.getElementById('customMenu');
const pauseMenu = document.getElementById('pauseMenu');
const gameOverMenu = document.getElementById('gameOverMenu');

const topControls = document.getElementById('topControls');
const hud = document.getElementById('hud');
const controlsLayer = document.querySelector('.controls-layer');

const btnSound = document.getElementById('btnSound');
const menuSoundToggle = document.getElementById('menuSoundToggle');
const btnPause = document.getElementById('btnPause');

// --- КАСТОМИЗАЦИЯ ПЕРСОНАЖА ---
const colorPalettes = [
    { name: 'CYAN', hex: '#00f0ff' },
    { name: 'ROSE', hex: '#ff0055' },

function drawPixelCrown(c, charX, charY) {
    c.save();
    c.fillStyle = '#ffd700';
    c.shadowColor = '#ffaa00';
    c.shadowBlur = 6;

    c.fillRect(charX + 4, charY - 2, 20, 3);
    c.fillRect(charX + 4, charY - 7, 4, 5);
    c.fillRect(charX + 12, charY - 9, 4, 7);
    c.fillRect(charX + 20, charY - 7, 4, 5);
    c.fillRect(charX + 8, charY - 4, 4, 2);
    c.fillRect(charX + 16, charY - 4, 4, 2);

    c.shadowBlur = 0;
    c.fillStyle = '#ff0055';
    c.fillRect(charX + 13, charY - 7, 2, 3);
    c.fillStyle = '#00f0ff';
    c.fillRect(charX + 5, charY - 5, 2, 2);
    c.fillRect(charX + 21, charY - 5, 2, 2);
    c.fillStyle = '#e6004c';
    c.fillRect(charX + 6, charY - 1, 16, 1.5);
    c.restore();
}

function drawEquippedHat(c, charX, charY) {
    if (userEquippedHat === 'crown') {
        drawPixelCrown(c, charX, charY);
    }
}

function toggleCrownHat() {
    userEquippedHat = (userEquippedHat === 'crown') ? 'none' : 'crown';

function initCustomizationUI() {
    const container = document.getElementById('colorSwatches');
    container.innerHTML = '';
    colorPalettes.forEach(col => {
        const chip = document.createElement('div');
        chip.className = `color-chip ${userSkinColor.toLowerCase() === col.hex.toLowerCase() ? 'active' : ''}`;
        chip.style.backgroundColor = col.hex;
        chip.onclick = () => selectSkinColor(col);
        container.appendChild(chip);
    });
    updateHatsUI();
    updatePreviewCanvas();
}

function selectSkinColor(col) {
    userSkinColor = col.hex;
    localStorage.setItem('cyber_jump_color', userSkinColor);
    document.getElementById('currentColorLabel').innerText = col.name;
    document.querySelectorAll('.color-chip').forEach(c => {
        c.classList.toggle('active', c.style.backgroundColor === col.hex || rgbToHex(c.style.backgroundColor) === col.hex);
    });
    updatePreviewCanvas();
}

function rgbToHex(rgb) {
    if (!rgb.startsWith('rgb')) return rgb;
    const nums = rgb.match(/\d+/g);
    return "#" + nums.slice(0,3).map(x => parseInt(x).toString(16).padStart(2, '0')).join('');
}

function updatePreviewCanvas() {
    const pCanvas = document.getElementById('skinPreviewCanvas');
    if (!pCanvas) return;
    const pCtx = pCanvas.getContext('2d');
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

    const cx = Math.round(pCanvas.width / 2 - 14);
    const cy = Math.round(pCanvas.height / 2 - 14);

    pCtx.fillStyle = '#0a0a20';
    pCtx.fillRect(cx - 15, cy + 40, 58, 8);
    pCtx.fillStyle = userSkinColor;
    pCtx.fillRect(cx - 15, cy + 40, 58, 2);

    pCtx.fillStyle = userSkinColor;
    pCtx.shadowBlur = 12;
    pCtx.shadowColor = userSkinColor;
    pCtx.fillRect(cx, cy, 28, 38);
    pCtx.shadowBlur = 0;

    pCtx.fillStyle = '#030310';
    pCtx.fillRect(cx + 17, cy + 7, 9, 7);
    pCtx.fillStyle = '#00ff88';
    pCtx.fillRect(cx + 20, cy + 9, 3, 3);

    drawEquippedHat(pCtx, cx, cy);
}

let audioCtx = null;
let soundEnabled = true;

function initAudio() {
    if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
    }
}

function updateSoundButtons() {
    const icon = soundEnabled ? '🔊' : '🔇';
    btnSound.innerText = icon;
    if (menuSoundToggle) menuSoundToggle.innerText = icon;
}

function toggleSound() {
    soundEnabled = !soundEnabled;
    updateSoundButtons();
}

btnSound.onclick = toggleSound;
menuSoundToggle.onclick = () => {
    initAudio();
    toggleSound();
};

function playSound(type) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;

    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'crt_hum') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(50, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'bios_beep') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'bounce') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(950, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'spring') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(1500, now + 0.3);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'shoot') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1000, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'drone_zap') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.linearRampToValueAtTime(200, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'jetpack') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.linearRampToValueAtTime(450, now + 0.35);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now); osc.stop(now + 0.35);
    } else if (type === 'die') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.linearRampToValueAtTime(40, now + 0.8);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
    }
}

function interpolateColor(color1, color2, factor) {
    const c1 = parseInt(color1.slice(1), 16);
    const c2 = parseInt(color2.slice(1), 16);
    const r1 = (c1 >> 16) & 255, g1 = (c1 >> 8) & 255, b1 = c1 & 255;
    const r2 = (c2 >> 16) & 255, g2 = (c2 >> 8) & 255, b2 = c2 & 255;
    const r = Math.round(r1 + factor * (r2 - r1));
    const g = Math.round(g1 + factor * (g2 - g1));
    const b = Math.round(b1 + factor * (b2 - b1));
    return `rgb(${r},${g},${b})`;
}

// --- УПРАВЛЕНИЕ: КЛАВИАТУРА ДЛЯ ПК + ТЕЛЕФОН ---
function setupInput() {
    window.addEventListener('keydown', (e) => {
        if (gameState === 'MAIN_MENU' && (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter')) {
            startFromMainMenu();
            return;
        }

        if (e.key === 'Escape' || e.code === 'Escape' || ['p', 'P', 'З', 'з'].includes(e.key)) {
            if (!customMenu.classList.contains('hidden')) {
                closeCustomMenu();
                return;
            }
            togglePause();
        }

        if (gameState !== 'PLAYING') return;

        if (e.code === 'KeyA' || e.key === 'ArrowLeft' || ['a', 'A', 'ф', 'Ф'].includes(e.key)) {
            keys.left = true;
        }
        if (e.code === 'KeyD' || e.key === 'ArrowRight' || ['d', 'D', 'в', 'В'].includes(e.key)) {
            keys.right = true;
        }
        if (e.code === 'KeyW' || e.key === 'ArrowUp' || ['w', 'W', 'ц', 'Ц'].includes(e.key)) {
            keys.up = true;
        }
        if (e.code === 'KeyS' || e.key === 'ArrowDown' || ['s', 'S', 'ы', 'Ы'].includes(e.key)) {
            keys.down = true;
        }
        if (e.code === 'KeyE' || e.code === 'Space' || e.key === ' ' || ['e', 'E', 'у', 'У'].includes(e.key)) {
            shoot();
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'KeyA' || e.key === 'ArrowLeft' || ['a', 'A', 'ф', 'Ф'].includes(e.key)) {
            keys.left = false;
        }
        if (e.code === 'KeyD' || e.key === 'ArrowRight' || ['d', 'D', 'в', 'В'].includes(e.key)) {
            keys.right = false;
        }
        if (e.code === 'KeyW' || e.key === 'ArrowUp' || ['w', 'W', 'ц', 'Ц'].includes(e.key)) {
            keys.up = false;
        }
        if (e.code === 'KeyS' || e.key === 'ArrowDown' || ['s', 'S', 'ы', 'Ы'].includes(e.key)) {
            keys.down = false;
        }
    });

    const bindTouch = (id, startFn, endFn) => {
        const btn = document.getElementById(id);
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); startFn(); });
        if(endFn) btn.addEventListener('touchend', (e) => { e.preventDefault(); endFn(); });
    };

    bindTouch('btnLeft', () => keys.left = true, () => keys.left = false);
    bindTouch('btnRight', () => keys.right = true, () => keys.right = false);
    bindTouch('btnShoot', shoot);
}

            size: Math.random() * 4 + 2,
            color,
            life: 1.0,
            decay: Math.random() * 0.04 + 0.02
        });
    }
}

function startDeathAnimation() {
    if (devState.godmode || devState.noclip) return;
    if (gameState === 'DYING' || gameState === 'GAMEOVER') return;
    gameState = 'DYING';
    player.vy = -7;
    player.jetpackTimer = 0;
    playSound('die');
}

function update() {
    animTicks++;

    if (gameState === 'MAIN_MENU') {
        if (Math.random() < 0.04) {
            meteors.push({
                x: Math.random() * canvas.width * 1.2 - 50,
                y: -50,
                vx: -3 - Math.random() * 5,
                vy: 5 + Math.random() * 7,
                length: 25 + Math.random() * 30,
                life: 1.0
            });
        }
        meteors.forEach(m => { m.x += m.vx; m.y += m.vy; m.life -= 0.015; });
        meteors = meteors.filter(m => m.life > 0);

        if (Math.random() < 0.03) {
            const size = 16 + Math.random() * 24;
            texturedMeteors.push({
                x: Math.random() > 0.5 ? -60 : canvas.width + 60,
                y: Math.random() * canvas.height,
                vx: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 1.8),
                vy: 1.0 + Math.random() * 2.0,
                size: size,
                angle: Math.random() * Math.PI,
                rotSpeed: (Math.random() - 0.5) * 0.03,
                craters: [
                    {dx: -size*0.3, dy: -size*0.2, r: size*0.2},
                    {dx: size*0.25, dy: size*0.2, r: size*0.15}
                ],
                life: 1.0
            });
        }
        texturedMeteors.forEach(tm => {
            tm.x += tm.vx; tm.y += tm.vy; tm.angle += tm.rotSpeed;
            if (tm.y > canvas.height + 100) tm.life = 0;
        });
        texturedMeteors = texturedMeteors.filter(tm => tm.life > 0);

        if (Math.random() < 0.25) {
            particles.push({
                x: Math.random() * canvas.width,
                y: canvas.height + 10,
                vx: (Math.random() - 0.5) * 0.8,
                vy: -Math.random() * 1.8 - 0.5,
                size: Math.random() * 3 + 1,
                color: Math.random() > 0.5 ? '#00f0ff' : '#ff00bb',
                life: 1.0,
                decay: 0.008
            });
        }
        particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; });
        particles = particles.filter(p => p.life > 0);

        const platW = 150;
        const platX = canvas.width / 2 - platW / 2;
        const platY = canvas.height * 0.68;
        if (Math.random() < 0.28) {
            menuSparks.push({
                x: platX + 12 + Math.random() * (platW - 24),
                y: platY + 16,
                vx: (Math.random() - 0.5) * 0.5,
                vy: -Math.random() * 1.4 - 0.6,
                size: Math.random() * 2 + 1,
                alpha: 1.0,
                color: Math.random() > 0.4 ? userSkinColor : '#ff00aa'
            });
        }
        menuSparks.forEach(s => {
            s.x += s.vx;
            s.y += s.vy;
            s.alpha -= 0.022;
        });
        menuSparks = menuSparks.filter(s => s.alpha > 0);

        cosmicPlanets.forEach(pl => {
            if (pl.satellites) pl.satellites.forEach(sat => sat.angle += sat.speed);
        });
        return;
    }

    if (gameState === 'CRT_BOOT') {
        bootTime += 1;
        if (bootTime > 20 && ramCount < 640) {
            ramCount += 16;
            if (ramCount % 128 === 0) playSound('bios_beep');
        }
        if (bootTime > 240) {
            startGame();
        }
        return;
    }

    if (gameState === 'DYING') {
        player.vy += gravity * 1.2;
        player.y += player.vy;
        player.angle += 0.22;
        if (cameraShake > 0) cameraShake *= 0.88;

        if (player.y > cameraY + canvas.height + 120) {
            gameOver();
        }
        return;
    }

    if (gameState !== 'PLAYING') return;

    if (maxScore > 300 && Math.random() < 0.025) {
        meteors.push({
            x: Math.random() * canvas.width * 1.2 - 50,
            y: cameraY - 50,
            vx: -4 - Math.random() * 6,
            vy: 6 + Math.random() * 8,
            length: 25 + Math.random() * 30,
            life: 1.0
        });
    }

    meteors.forEach(m => {
        m.x += m.vx;
        m.y += m.vy;
        m.life -= 0.02;
    });
    meteors = meteors.filter(m => m.life > 0);

    if (maxScore > 150 && Math.random() < 0.04) {
        const size = 16 + Math.random() * 28;
        texturedMeteors.push({
            x: Math.random() > 0.5 ? -60 : canvas.width + 60,
            y: cameraY + Math.random() * canvas.height,
            vx: (Math.random() > 0.5 ? 1 : -1) * (1.2 + Math.random() * 2.2),
            vy: 1.5 + Math.random() * 2.5,
            size: size,
            angle: Math.random() * Math.PI,
            rotSpeed: (Math.random() - 0.5) * 0.04,
            shapeSeed: Math.floor(Math.random() * 5),
            craters: [
                {dx: -size*0.3, dy: -size*0.2, r: size*0.2},
                {dx: size*0.25, dy: size*0.2, r: size*0.15},
                {dx: 0, dy: -size*0.4, r: size*0.12}
            ],
            life: 1.0
        });
    }

    texturedMeteors.forEach(tm => {
        tm.x += tm.vx;
        tm.y += tm.vy;
        tm.angle += tm.rotSpeed;
        if (tm.y > cameraY + canvas.height + 100) tm.life = 0;
    });
    texturedMeteors = texturedMeteors.filter(tm => tm.life > 0);

    cosmicPlanets.forEach(pl => {
        if (pl.satellites) {
            pl.satellites.forEach(sat => {
                sat.angle += sat.speed;
            });
        }
    });

    satellites.forEach(s => {
        s.x += s.speed;
        if (s.x > canvas.width + 50) s.x = -50;
    });

    player.scaleX += (1 - player.scaleX) * 0.18;
    player.scaleY += (1 - player.scaleY) * 0.18;

    if (cameraShake > 0) cameraShake *= 0.88;

    if (devState.noclip) {
        const flySpeed = 12;
        player.vx = 0;
        player.vy = 0;
        if (keys.left) player.vx = -flySpeed;
        if (keys.right) player.vx = flySpeed;
        if (keys.up) player.vy = -flySpeed;
        if (keys.down) player.vy = flySpeed;
        
        player.x += player.vx;
        player.y += player.vy;
    } else {
        if (keys.left) player.vx = -player.speed;
        else if (keys.right) player.vx = player.speed;
        else player.vx *= 0.82;

        player.x += player.vx;

        if (player.jetpackTimer > 0) {
            player.jetpackTimer--;
            player.vy = -16.5;
            player.scaleX = 0.8; player.scaleY = 1.4;
            cameraShake = Math.max(cameraShake, 2);
            createParticles(player.x + player.width / 2, player.y + player.height, 3, '#ff0055', 1.2);
        } else {
            player.vy += gravity;
        }

        player.y += player.vy;
    }

    if (player.x < -player.width) player.x = canvas.width;
    if (player.x > canvas.width) player.x = -player.width;

    player.trail.push({ x: player.x, y: player.y, alpha: 0.6, scaleX: player.scaleX, scaleY: player.scaleY });
    if (player.trail.length > 6) player.trail.shift();

    if (player.y < cameraY + canvas.height * 0.48) {
        const diff = (cameraY + canvas.height * 0.48) - player.y;
        cameraY -= diff;
    }

    const currentScore = Math.floor(-cameraY / 10);
    if (currentScore > maxScore) {
        maxScore = currentScore;
        scoreEl.innerText = maxScore;
    }

    generateWorldAbove(cameraY);

    if (!devState.noclip) {
        platforms.forEach(plat => {
            if (plat.type === 'moving') {
                plat.x += plat.vx;
                if (plat.x <= 0 || plat.x + plat.width >= canvas.width) plat.vx *= -1;
            }

            if (plat.type === 'crumb' && plat.falling) {
                plat.vy += 0.45;
                plat.y += plat.vy;
                plat.angle += plat.rotSpeed;
                plat.alpha -= 0.016;
                if (Math.random() < 0.25) {
                    createParticles(plat.x + Math.random() * plat.width, plat.y + 8, 1, '#ff3333');
                }
            }

            if (
                !plat.falling &&
                player.vy > 0 &&
                player.x + player.width > plat.x &&
                player.x < plat.x + plat.width &&
                player.y + player.height >= plat.y &&
                player.y + player.height <= plat.y + plat.height + player.vy
            ) {
                if (plat.type === 'crumb') {
                    player.vy = -jumpForce;
                    player.scaleX = 1.6; player.scaleY = 0.45;
                    comboCount = 0;
                    playSound('bounce');
                    createParticles(plat.x + plat.width / 2, plat.y, 14, '#ff3333');

                    plat.falling = true;
                    plat.vy = 2.0;
                    plat.rotSpeed = (Math.random() > 0.5 ? 1 : -1) * 0.035;
                } else {
                    player.vy = -jumpForce;
                    player.scaleX = 1.6; player.scaleY = 0.45;
                    comboCount = 0;
                    playSound('bounce');
                    createParticles(player.x + player.width/2, player.y + player.height, 10, userSkinColor);
                }
            }
        });

        springs.forEach(sp => {
            sp.x = sp.plat.x + sp.plat.width / 2 - 12;
            if (sp.animTimer > 0) sp.animTimer--;

            if (
                player.vy > 0 &&
                player.x + player.width > sp.x &&
                player.x < sp.x + sp.width &&
                player.y + player.height >= sp.y &&
                player.y + player.height <= sp.y + sp.height + player.vy
            ) {
                player.vy = -jumpForce * 1.88;
                player.scaleX = 0.5; player.scaleY = 1.7;
                sp.animTimer = 16;
                cameraShake = 8;
                playSound('spring');
                addFloatingText('SUPER JUMP!', sp.x, sp.y - 10, '#ffff00');
                createShockwave(sp.x + sp.width/2, sp.y, '#ffff00');
                createParticles(sp.x + sp.width/2, sp.y, 22, '#ffff00', 1.8);
            }
        });
    }

    powerups.forEach(pw => {
        if (!pw.collected && 
            player.x < pw.x + pw.width && player.x + player.width > pw.x &&
            player.y < pw.y + pw.height && player.y + player.height > pw.y) {
            pw.collected = true;
            player.jetpackTimer = 120;
            playSound('jetpack');
            addFloatingText('JETPACK! +500', pw.x, pw.y - 10, '#ff0055');
            createShockwave(pw.x + pw.width/2, pw.y + pw.height/2, '#ff0055');
        }
    });

    bullets.forEach(b => b.y += b.vy);

    enemies.forEach(e => {
        if (!e.alive) return;
        e.x += e.vx;
        e.wingAnim += 0.2;
        if (e.x <= 0 || e.x + e.width >= canvas.width) e.vx *= -1;

        if (Math.random() < 0.005) playSound('drone_zap');

        bullets.forEach(b => {
            if (b.y < e.y + e.height && b.y > e.y && b.x > e.x && b.x < e.x + e.width) {
                e.alive = false;
                b.y = -999;
                comboCount++;
                cameraShake = 10;
                const bonus = 200 * comboCount;
                addFloatingText(comboCount > 1 ? `COMBO x${comboCount}! +${bonus}` : `DESTROYED! +200`, e.x, e.y, '#ff0055');
                createShockwave(e.x + e.width/2, e.y + e.height/2, '#ff0055');
                createParticles(e.x + e.width/2, e.y + e.height/2, 32, '#ff0055', 2.2);
                playSound('bounce');
            }
        });

        if (!devState.noclip && e.alive && player.x < e.x + e.width && player.x + player.width > e.x &&
            player.y < e.y + e.height && player.y + player.height > e.y) {
            if (player.vy > 0 && player.y + player.height < e.y + 16) {
                e.alive = false;
                player.vy = -jumpForce;
                player.scaleX = 1.4; player.scaleY = 0.6;
                cameraShake = 6;
                addFloatingText('STOMP!', e.x, e.y, userSkinColor);
                createParticles(e.x + e.width/2, e.y, 20, userSkinColor);
            } else if (player.jetpackTimer <= 0 && !devState.godmode) {
                startDeathAnimation();
            }
        }
    });

    floatingTexts.forEach(ft => { ft.y += ft.vy; ft.alpha -= 0.025; });
    floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);

    platforms = platforms.filter(p => {
        if (p.falling) {
            return p.alpha > 0 && p.y < cameraY + canvas.height + 150;
        }
        return p.y < cameraY + canvas.height + 60;
    });

    springs = springs.filter(s => s.y < cameraY + canvas.height + 60);
    powerups = powerups.filter(p => !p.collected && p.y < cameraY + canvas.height + 60);
    enemies = enemies.filter(e => e.alive && e.y < cameraY + canvas.height + 60);
    bullets = bullets.filter(b => b.y > cameraY - 100);

    shockwaves.forEach(sw => { sw.radius += 3.5; sw.alpha -= 0.05; });
    shockwaves = shockwaves.filter(sw => sw.alpha > 0);

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; });
    particles = particles.filter(p => p.life > 0);

    if (!devState.noclip && !devState.godmode && player.y > cameraY + canvas.height + 50) {
        startDeathAnimation();
    }
}

function gameOver() {
    gameState = 'GAMEOVER';
    finalScoreEl.innerText = maxScore;
    if (maxScore > highScore) {
        highScore = maxScore;
        localStorage.setItem('cyber_jump_hs', highScore);
        highScoreEl.innerText = highScore;
        if (menuHighScoreEl) menuHighScoreEl.innerText = highScore;
    }
    gameOverMenu.classList.remove('hidden');
}

// --- ОТРИСОВКА ПЛАНЕТ ---
function drawPlanet(pl, screenY) {
    ctx.save();
    ctx.translate(pl.x, screenY);

    if (pl.type === 'moon') {
        const grad = ctx.createRadialGradient(-pl.radius*0.3, -pl.radius*0.3, 5, 0, 0, pl.radius);
        grad.addColorStop(0, '#e0e0e0');
        grad.addColorStop(0.7, '#888888');
        grad.addColorStop(1, '#333333');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, pl.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(40, 40, 40, 0.45)';
        ctx.beginPath(); ctx.arc(-12, -10, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(14, 12, 14, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-6, 18, 7, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(15, -15, 8, 0, Math.PI * 2); ctx.fill();
    }
    else if (pl.type === 'mars') {
        const grad = ctx.createRadialGradient(-pl.radius*0.3, -pl.radius*0.3, 5, 0, 0, pl.radius);
        grad.addColorStop(0, '#ff7755');
        grad.addColorStop(0.7, '#cc3311');
        grad.addColorStop(1, '#660000');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, pl.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(80, 10, 0, 0.5)';
        ctx.beginPath(); ctx.arc(-15, -10, 12, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(18, 14, 16, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-8, 20, 9, 0, Math.PI * 2); ctx.fill();
        
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.beginPath();
        ctx.arc(0, -pl.radius + 6, 14, 0, Math.PI);
        ctx.fill();
    } 
    else if (pl.type === 'jupiter') {
        ctx.beginPath();
        ctx.arc(0, 0, pl.radius, 0, Math.PI * 2);
        ctx.clip();

        const grad = ctx.createLinearGradient(0, -pl.radius, 0, pl.radius);
        grad.addColorStop(0, '#cc8844');
        grad.addColorStop(0.2, '#eebbbb');
        grad.addColorStop(0.4, '#aa5522');
        grad.addColorStop(0.6, '#ffddee');
        grad.addColorStop(0.8, '#994411');
        grad.addColorStop(1, '#552200');
        ctx.fillStyle = grad;
        ctx.fillRect(-pl.radius, -pl.radius, pl.radius * 2, pl.radius * 2);

        ctx.fillStyle = '#cc2200';
        ctx.beginPath();
        ctx.ellipse(pl.radius * 0.3, pl.radius * 0.25, 20, 13, 0, 0, Math.PI * 2);
        ctx.fill();
    } 
    else if (pl.type === 'saturn') {
        ctx.strokeStyle = 'rgba(230, 200, 140, 0.7)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.ellipse(0, 0, pl.radius * 2.2, pl.radius * 0.5, Math.PI / 6, Math.PI, Math.PI * 2);
        ctx.stroke();

        const grad = ctx.createRadialGradient(-10, -10, 5, 0, 0, pl.radius);
        grad.addColorStop(0, '#ffeaa7');
        grad.addColorStop(0.7, '#dfe6e9');
        grad.addColorStop(1, '#fdcb6e');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, pl.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(230, 200, 140, 0.9)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.ellipse(0, 0, pl.radius * 2.2, pl.radius * 0.5, Math.PI / 6, 0, Math.PI);
        ctx.stroke();
    } 
    else if (pl.type === 'neptune') {
        const grad = ctx.createRadialGradient(-15, -15, 5, 0, 0, pl.radius);
        grad.addColorStop(0, '#00d2ff');
        grad.addColorStop(0.6, '#0040ff');
        grad.addColorStop(1, '#000080');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, pl.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, pl.radius - 6, 0.2, 1.8);
        ctx.stroke();
    }

    if (pl.satellites) {
        pl.satellites.forEach(sat => {
            const sx = Math.cos(sat.angle) * sat.orbitRadius;
            const sy = Math.sin(sat.angle) * (sat.orbitRadius * 0.4);
            ctx.fillStyle = sat.color;
            ctx.beginPath();
            ctx.arc(sx, sy, sat.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    ctx.font = '900 12px Orbitron';
    ctx.fillStyle = pl.labelColor;
    ctx.textAlign = 'center';
    ctx.fillText(`[ ${pl.name} ]`, 0, pl.radius + 24);

    ctx.restore();
}

// --- РЕНДЕР ТЕКСТУРИРОВАННЫХ МЕТЕОРОВ ---
function drawTexturedMeteor(tm, renderYOverride) {
    ctx.save();
    const renderY = renderYOverride !== undefined ? renderYOverride : tm.y - cameraY;
    ctx.translate(tm.x, renderY);
    ctx.rotate(tm.angle);

    ctx.fillStyle = '#4a4a5e';
    ctx.strokeStyle = '#222233';
    ctx.lineWidth = 2;

    ctx.beginPath();
    const pts = 7;
    for (let i = 0; i < pts; i++) {
        const angle = (i / pts) * Math.PI * 2;
        const rVar = tm.size * (0.8 + ((i % 2) * 0.3));
        const px = Math.cos(angle) * rVar;
        const py = Math.sin(angle) * rVar;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#2b2b3a';
    if (tm.craters) {
        tm.craters.forEach(cr => {
            ctx.beginPath();
            ctx.arc(cr.dx, cr.dy, cr.r, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    ctx.restore();
}

// --- CRT БИОС DRAW ---
function drawCRTBoot() {
    ctx.fillStyle = '#02020a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.font = '13px "Share Tech Mono", monospace';
    ctx.fillStyle = '#00f0ff';

    if (bootTime < 15) {
        const flashH = (15 - bootTime) * 12;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, canvas.height/2 - flashH/2, canvas.width, flashH);
        ctx.restore();
        return;
    }

    if (bootTime < 45) {
        const progress = (bootTime - 15) / 30;
        const curH = canvas.height * progress;
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, (canvas.height - curH) / 2);
        ctx.fillRect(0, (canvas.height + curH) / 2, canvas.width, canvas.height);
        
        ctx.fillStyle = '#00f0ff';
        ctx.fillRect(0, (canvas.height - curH) / 2, canvas.width, 2);
        ctx.fillRect(0, (canvas.height + curH) / 2, canvas.width, 2);
    }

    ctx.fillText("CYBER_SYSTEMS BIOS v2.026 (C) 1998-2026", 25, 45);
    ctx.fillText("CPU: QUANTUM-8 REAL-MODE 120MHz", 25, 68);
    ctx.fillText(`BASE MEMORY TEST: ${ramCount} KB OK`, 25, 91);

    if (bootTime > 80) {
        ctx.fillStyle = '#ffff00';
        ctx.fillText("PRIMARY MASTER: MOON_PLANETARY_ORBIT_MAP", 25, 125);
        ctx.fillText("SECONDARY MASTER: DEEP_COSMOS_GIANT_STARS", 25, 148);
    }

    if (bootTime > 130) {
        ctx.fillStyle = '#00ff66';
        ctx.fillText("> INITIALIZING CORE ENGINE...", 25, 190);
        ctx.fillText("> LOADING MOON_MARS_SATURN ... OK", 25, 213);
        ctx.fillText("> COMPILING METEOR_TEXTURES_MODULE ... OK", 25, 236);
        ctx.fillText("> MOUNTING AUDIO SYNTHESIZER ... OK", 25, 259);
    }

    if (bootTime > 190) {
        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 16px Orbitron';
        ctx.fillText(">>> ALL SYSTEMS NOMINAL. LAUNCHING...", 25, 310);
    }

    const beamY = (bootTime * 7) % canvas.height;
    ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.fillRect(0, beamY, canvas.width, 4);

    if (Math.random() < 0.12) {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, 80, 2);
    }

    ctx.restore();
}

// --- ОТРИСОВКА ГЛАВНОГО МЕНЮ ---
function drawMainMenu() {
    ctx.save();

    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    skyGrad.addColorStop(0, '#020210');
    skyGrad.addColorStop(0.5, '#06051c');
    skyGrad.addColorStop(1, '#010006');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.globalCompositeOperation = 'lighter';
    cosmicNebulae.forEach(neb => {
        const grad = ctx.createRadialGradient(neb.x, neb.worldY + 2000, 5, neb.x, neb.worldY + 2000, neb.radius);
        grad.addColorStop(0, neb.color + '0.22)');
        grad.addColorStop(1, neb.color + '0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(neb.x, neb.worldY + 2000, neb.radius, 0, Math.PI * 2);
        ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';

    bgStars.forEach(st => {
        ctx.fillStyle = st.color;
        ctx.globalAlpha = st.alpha * (0.8 + Math.sin(animTicks * st.blinkSpeed) * 0.2);
        ctx.fillRect(st.x, (st.y % canvas.height), st.size, st.size);
    });
    ctx.globalAlpha = 1.0;

    const planetY = canvas.height * 0.26;
    drawPlanet(cosmicPlanets[0], planetY);

    ctx.save();
    ctx.translate(cosmicPlanets[0].x, planetY);
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(0, 0, cosmicPlanets[0].radius + 20, animTicks * 0.006, animTicks * 0.006 + Math.PI * 1.3);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255, 0, 119, 0.35)';
    ctx.beginPath();
    ctx.arc(0, 0, cosmicPlanets[0].radius + 32, -animTicks * 0.008, -animTicks * 0.008 + Math.PI * 0.8);
    ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    meteors.forEach(m => {
        ctx.globalAlpha = m.life;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x - m.vx * 3, m.y - m.vy * 3);
        ctx.stroke();
    });
    ctx.globalAlpha = 1.0;

    texturedMeteors.forEach(tm => drawTexturedMeteor(tm, tm.y));

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    const platY = Math.round(canvas.height * 0.68);
    const platW = 150;
    const platH = 16;
    const platX = Math.round(canvas.width / 2 - platW / 2);

    ctx.save();
    const vpX = canvas.width / 2;
    const vpY = platY + platH;
    const gridGrad = ctx.createLinearGradient(0, vpY, 0, canvas.height);
    gridGrad.addColorStop(0, 'rgba(0, 240, 255, 0.02)');
    gridGrad.addColorStop(0.45, 'rgba(0, 240, 255, 0.08)');
    gridGrad.addColorStop(1, 'rgba(0, 240, 255, 0.01)');
    ctx.strokeStyle = gridGrad;
    ctx.lineWidth = 1;

    const gridLines = 10;
    for (let i = 0; i <= gridLines; i++) {
        const gx = (canvas.width / gridLines) * i;
        ctx.beginPath();
        ctx.moveTo(gx, canvas.height);
        ctx.lineTo(vpX + (gx - vpX) * 0.22, vpY);
        ctx.stroke();
    }
    for (let h = vpY + 14; h < canvas.height; h += 20) {
        const progress = (h - vpY) / (canvas.height - vpY);
        const span = (canvas.width * 0.25) + progress * (canvas.width * 0.75);
        ctx.beginPath();
        ctx.moveTo(vpX - span / 2, h);
        ctx.lineTo(vpX + span / 2, h);
        ctx.stroke();
    }
    ctx.restore();

    ctx.globalCompositeOperation = 'lighter';
    const beamGrad = ctx.createLinearGradient(0, platY + platH, 0, canvas.height);
    beamGrad.addColorStop(0, 'rgba(0, 240, 255, 0.28)');
    beamGrad.addColorStop(0.35, 'rgba(0, 200, 255, 0.12)');
    beamGrad.addColorStop(0.7, 'rgba(122, 0, 255, 0.04)');
    beamGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = beamGrad;
    ctx.beginPath();
    ctx.moveTo(platX, platY + platH);
    ctx.lineTo(platX + platW, platY + platH);
    ctx.lineTo(platX + platW + 28, canvas.height);
    ctx.lineTo(platX - 28, canvas.height);
    ctx.closePath();
    ctx.fill();

    const underGlow = ctx.createRadialGradient(canvas.width / 2, platY + platH, 2, canvas.width / 2, platY + platH, platW / 2);
    underGlow.addColorStop(0, 'rgba(0, 240, 255, 0.35)');
    underGlow.addColorStop(0.7, 'rgba(0, 240, 255, 0.08)');
    underGlow.addColorStop(1, 'rgba(0, 240, 255, 0)');
    ctx.fillStyle = underGlow;
    ctx.fillRect(platX, platY + platH, platW, 25);

    const ringScanY = platY + platH + ((animTicks * 1.5) % 65);
    const ringProgress = (ringScanY - (platY + platH)) / 65;
    const ringAlpha = (1 - ringProgress) * 0.55;
    const currentRingRadius = (platW / 2 - 12) + ringProgress * 14;
    ctx.strokeStyle = `rgba(0, 240, 255, ${ringAlpha})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, ringScanY, currentRingRadius, 6, 0, 0, Math.PI * 2);
    ctx.stroke();

    menuSparks.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#0a0a20';
    ctx.fillRect(platX, platY, platW, platH);

    ctx.fillStyle = '#00f0ff';
    ctx.fillRect(platX, platY, platW, 4);

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(0, 240, 255, 0.35)';
    ctx.fillRect(platX, platY, platW, 4);
    ctx.globalCompositeOperation = 'source-over';

    const pulseLight = (Math.sin(animTicks * 0.1) + 1) * 0.5;
    ctx.fillStyle = `rgba(255, 0, 119, ${0.4 + pulseLight * 0.6})`;
    ctx.fillRect(platX + 4, platY + 6, 6, platH - 8);
    ctx.fillRect(platX + platW - 10, platY + 6, 6, platH - 8);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
    const slotCount = 7;
    const startX = platX + 18;
    const slotStep = (platW - 36) / (slotCount - 1);
    for (let i = 0; i < slotCount; i++) {
        ctx.fillRect(Math.round(startX + i * slotStep), platY + 6, 2, platH - 8);
    }

    const idleOffset = Math.sin(animTicks * 0.08) * 3;
    const charX = Math.round(canvas.width / 2 - player.width / 2);
    const charY = Math.round(platY - player.height + idleOffset);

    const shadowR = Math.max(8, 12 + idleOffset * 1.2);
    ctx.fillStyle = 'rgba(0, 240, 255, 0.25)';
    ctx.beginPath();
    ctx.ellipse(canvas.width / 2, platY + 2, shadowR, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = userSkinColor;
    ctx.fillRect(charX, charY, player.width, player.height);

    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = userSkinColor;
    ctx.globalAlpha = 0.35;
    ctx.fillRect(charX - 2, charY - 2, player.width + 4, player.height + 4);
    ctx.globalAlpha = 1.0;
    ctx.globalCompositeOperation = 'source-over';

    ctx.fillStyle = '#030310';
    ctx.fillRect(charX + player.width - 11, charY + 7, 9, 7);

    const eyeGlint = ((animTicks % 35) / 35) * 7;
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(charX + player.width - 11 + eyeGlint, charY + 9, 2, 3);

    drawEquippedHat(ctx, charX, charY);

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MAIN_MENU') {
        drawMainMenu();
        return;
    }

    if (gameState === 'CRT_BOOT') {
        drawCRTBoot();
        return;
    }

    const currentAltitude = Math.max(0, -cameraY / 10);
    const spaceProgress = Math.min(1, Math.max(0, currentAltitude / 1000));

    ctx.save();
    
    const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    if (spaceProgress < 0.5) {
        const factor = spaceProgress * 2;
        skyGrad.addColorStop(0, interpolateColor('#050515', '#020212', factor));
        skyGrad.addColorStop(1, interpolateColor('#0d0b2b', '#06001a', factor));
    } else {
        const factor = (spaceProgress - 0.5) * 2;
        skyGrad.addColorStop(0, interpolateColor('#020212', '#010003', factor));
        skyGrad.addColorStop(1, interpolateColor('#06001a', '#000000', factor));
    }
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    giantStars.forEach(gs => {
        const screenY = gs.worldY - cameraY * 0.05;
        if (screenY > -150 && screenY < canvas.height + 150) {
            const pulse = Math.sin(animTicks * gs.pulseSpeed) * 8;
            const curRadius = gs.radius + pulse;

            const gGrad = ctx.createRadialGradient(gs.x, screenY, 2, gs.x, screenY, curRadius);
            gGrad.addColorStop(0, '#ffffff');
            gGrad.addColorStop(0.4, gs.colorCore);
            gGrad.addColorStop(1, gs.colorCorona);

            ctx.fillStyle = gGrad;
            ctx.beginPath();
            ctx.arc(gs.x, screenY, curRadius, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    bgStars.forEach(st => {
        const py = (st.y - cameraY * 0.08) % (canvas.height * 2);
        ctx.fillStyle = st.color;
        const starAlpha = Math.min(1, st.alpha + spaceProgress * 0.4);
        ctx.globalAlpha = starAlpha * (0.8 + Math.sin(animTicks * st.blinkSpeed) * 0.2);
        ctx.fillRect(st.x, py < 0 ? py + canvas.height * 2 : py, st.size, st.size);
    });
    ctx.globalAlpha = 1.0;

    cosmicNebulae.forEach(neb => {
        const screenY = neb.worldY - cameraY * 0.15;
        if (screenY > -neb.radius * 2 && screenY < canvas.height + neb.radius * 2) {
            const alpha = Math.min(1, spaceProgress * 1.5) * 0.38;
            const grad = ctx.createRadialGradient(neb.x, screenY, 10, neb.x, screenY, neb.radius);
            grad.addColorStop(0, neb.color + alpha + ')');
            grad.addColorStop(1, neb.color + '0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(neb.x, screenY, neb.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    });

    cosmicPlanets.forEach(pl => {
        const screenY = pl.worldY - cameraY * 0.22;
        if (screenY > -pl.radius * 3 && screenY < canvas.height + pl.radius * 3) {
            drawPlanet(pl, screenY);
        }
    });

    ctx.strokeStyle = '#00f0ff';
    ctx.lineWidth = 2;
    meteors.forEach(m => {
        ctx.globalAlpha = m.life;
        ctx.beginPath();
        ctx.moveTo(m.x, m.y - cameraY);
        ctx.lineTo(m.x - m.vx * 3, m.y - cameraY - m.vy * 3);
        ctx.stroke();
    });
    ctx.globalAlpha = 1.0;

    texturedMeteors.forEach(tm => {
        drawTexturedMeteor(tm);
    });

    satellites.forEach(s => {
        const screenY = s.worldY - cameraY * 0.25;
        if (screenY > -20 && screenY < canvas.height + 20) {
            ctx.fillStyle = '#cccccc';
            ctx.fillRect(s.x, screenY, s.size, s.size / 2);
            ctx.fillStyle = (animTicks % 20 < 10) ? '#ff0055' : '#00f0ff';
            ctx.fillRect(s.x + 2, screenY - 2, 2, 2);
        }
    });

    const citySinkOffset = Math.max(0, -cameraY * 0.10);

    if (citySinkOffset < canvas.height + 400) {
        bgBuildingsFar.forEach(b => {
            const drawY = canvas.height - b.height + citySinkOffset;
            if (drawY < canvas.height + 150) {
                ctx.fillStyle = '#080822';
                ctx.fillRect(b.x, drawY, b.width, b.height);

                b.windows.forEach(w => {
                    ctx.fillStyle = w.color;
                    ctx.globalAlpha = Math.max(0, 0.6 - spaceProgress * 0.8);
                    ctx.fillRect(b.x + w.x, drawY + w.y, 4, 6);
                });
                ctx.globalAlpha = 1.0;
            }
        });

        bgBuildingsNear.forEach(b => {
            const drawY = canvas.height - b.height + citySinkOffset * 1.25;
            if (drawY < canvas.height + 150) {
                ctx.fillStyle = '#0e0e38';
                ctx.fillRect(b.x, drawY, b.width, b.height);

                b.windows.forEach(w => {
                    ctx.fillStyle = w.color;
                    ctx.globalAlpha = Math.max(0, 0.85 - spaceProgress * 0.9);
                    ctx.fillRect(b.x + w.x, drawY + w.y, 5, 8);
                });
                ctx.globalAlpha = 1.0;
            }
        });

        if (spaceProgress > 0.15 && spaceProgress < 0.8) {
            const earthGlowY = canvas.height + citySinkOffset * 0.8;
            const eGrad = ctx.createLinearGradient(0, earthGlowY - 120, 0, earthGlowY);
            eGrad.addColorStop(0, 'rgba(0, 240, 255, 0)');
            eGrad.addColorStop(1, 'rgba(0, 150, 255, 0.45)');
            ctx.fillStyle = eGrad;
            ctx.fillRect(0, earthGlowY - 120, canvas.width, 120);
        }
    }

    const shakeX = (Math.random() - 0.5) * cameraShake;
    const shakeY = (Math.random() - 0.5) * cameraShake;
    ctx.translate(shakeX, -cameraY + shakeY);

    platforms.forEach(plat => {
        ctx.save();
        if (plat.falling) {
            ctx.globalAlpha = Math.max(0, plat.alpha !== undefined ? plat.alpha : 1);
            ctx.translate(plat.x + plat.width / 2, plat.y + plat.height / 2);
            ctx.rotate(plat.angle || 0);
            ctx.translate(-(plat.x + plat.width / 2), -(plat.y + plat.height / 2));
        }

        let topColor = '#00f0ff';
        if (plat.type === 'moving') topColor = '#ff00bb';
        if (plat.type === 'crumb') topColor = '#ff3333';

        ctx.fillStyle = '#10102b';
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);

        ctx.fillStyle = topColor;
        ctx.shadowBlur = 10; ctx.shadowColor = topColor;
        ctx.fillRect(plat.x, plat.y, plat.width, 4);
        ctx.shadowBlur = 0;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        for(let i = plat.x + 8; i < plat.x + plat.width - 5; i += 18) {
            ctx.fillRect(i, plat.y + 6, 2, plat.height - 8);
        }

        if (plat.type === 'normal') {
            ctx.fillStyle = '#00f0ff';
            ctx.globalAlpha = (Math.sin(animTicks * 0.1 + plat.x) + 1) * 0.5;
            ctx.fillRect(plat.x + 4, plat.y + plat.height / 2, 4, 4);
            ctx.fillRect(plat.x + plat.width - 8, plat.y + plat.height / 2, 4, 4);
            ctx.globalAlpha = 1.0;
        } 
        else if (plat.type === 'moving') {
            ctx.fillStyle = '#ff00bb';
            ctx.fillRect(plat.x - 4, plat.y + 4, 4, 8);
            ctx.fillRect(plat.x + plat.width, plat.y + 4, 4, 8);
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(plat.x - 8, plat.y + 6, 4, 4);
            ctx.fillRect(plat.x + plat.width + 4, plat.y + 6, 4, 4);
        } 
        else if (plat.type === 'crumb') {
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(plat.x + 10, plat.y + 8, 12, 4);
            ctx.fillRect(plat.x + 35, plat.y + 8, 12, 4);
            ctx.strokeStyle = '#050515';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(plat.x + plat.width/2, plat.y + 4);
            ctx.lineTo(plat.x + plat.width/2 - 4, plat.y + 10);
            ctx.lineTo(plat.x + plat.width/2 + 2, plat.y + 16);
            ctx.stroke();
        }

        ctx.restore();
    });

    springs.forEach(sp => {
        let compressionOffset = 0;
        if (sp.animTimer > 0) {
            compressionOffset = Math.sin(sp.animTimer * 0.4) * 6;
        }

        ctx.fillStyle = '#3a3a5a';
        ctx.fillRect(sp.x, sp.y + sp.height - 4, sp.width, 4);

        const padY = sp.y + compressionOffset;
        ctx.fillStyle = '#ffff00';
        ctx.shadowBlur = 12; ctx.shadowColor = '#ffff00';
        ctx.fillRect(sp.x, padY, sp.width, 4);
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#7a7a9a';
        ctx.fillRect(sp.x + 4, padY + 4, sp.width - 8, 2);
        ctx.fillRect(sp.x + 4, padY + 8, sp.width - 8, 2);
    });

    powerups.forEach(pw => {
        if (!pw.collected) {
            ctx.fillStyle = '#ff0055';
            ctx.shadowBlur = 14; ctx.shadowColor = '#ff0055';
            ctx.fillRect(pw.x, pw.y, pw.width, pw.height);
            ctx.fillStyle = '#ffff00';
            ctx.fillRect(pw.x + 7, pw.y + 4, 12, 18);
            ctx.shadowBlur = 0;
        }
    });

    enemies.forEach(e => {
        if (e.alive) {
            ctx.save();
            ctx.translate(e.x + e.width / 2, e.y + e.height / 2);

            const wingY = Math.sin(e.wingAnim) * 3;
            ctx.fillStyle = '#7a00ff';
            ctx.fillRect(-e.width/2 - 4, -6 + wingY, 6, 12);
            ctx.fillRect(e.width/2 - 2, -6 - wingY, 6, 12);

            ctx.fillStyle = '#181838';
            ctx.strokeStyle = '#ff0055';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 12; ctx.shadowColor = '#ff0055';
            ctx.fillRect(-e.width/2, -e.height/2, e.width, e.height);
            ctx.strokeRect(-e.width/2, -e.height/2, e.width, e.height);

            ctx.fillStyle = (Math.floor(animTicks / 10) % 2 === 0) ? '#ff0055' : '#ffff00';
            ctx.fillRect(-6, -4, 12, 8);

            ctx.fillStyle = '#00f0ff';
            ctx.fillRect(-12, -10, 24, 4);

            ctx.restore();
            ctx.shadowBlur = 0;
        }
    });

    shockwaves.forEach(sw => {
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 3;
        ctx.globalAlpha = sw.alpha;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
    });
    ctx.globalAlpha = 1.0;

    ctx.fillStyle = '#ffff00';
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffff00';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));
    ctx.shadowBlur = 0;

    floatingTexts.forEach(ft => {
        ctx.font = '900 13px Orbitron';
        ctx.fillStyle = ft.color;
        ctx.globalAlpha = ft.alpha;
        ctx.fillText(ft.text, ft.x, ft.y);
    });
    ctx.globalAlpha = 1.0;

    player.trail.forEach(t => {
        ctx.fillStyle = devState.noclip ? 'rgba(0, 255, 136, 0.4)' : `rgba(0, 240, 255, ${t.alpha * 0.4})`;
        ctx.save();
        ctx.translate(t.x + player.width / 2, t.y + player.height / 2);
        ctx.scale(t.scaleX, t.scaleY);
        ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
        ctx.restore();
        t.alpha -= 0.08;
    });

    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1.0;

    ctx.save();
    ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
    ctx.rotate(player.angle);
    ctx.scale(player.scaleX, player.scaleY);

    let playerColor = userSkinColor;
    if (devState.noclip) playerColor = '#00ff88';
    else if (devState.godmode) playerColor = '#ffff00';
    else if (gameState === 'DYING') playerColor = '#ff0033';
    else if (player.jetpackTimer > 0) playerColor = '#ff0055';

    ctx.fillStyle = playerColor;
    ctx.shadowBlur = 16; ctx.shadowColor = playerColor;
    ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.fillRect(player.vx < 0 ? -player.width/2 + 3 : 3, -player.height/2 + 6, 8, 8);

    drawEquippedHat(ctx, -player.width / 2, -player.height / 2);

    ctx.restore();

    ctx.restore();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resizeCanvas();
window.addEventListener('resize', resizeCanvas);
setupInput();
initCustomizationUI();
loop();
</script>
</body>
